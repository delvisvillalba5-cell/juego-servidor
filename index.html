<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #181512;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #error-banner {
            display: none;
            position: absolute;
            top: 66px;
            left: 14px;
            right: 14px;
            z-index: 70;
            background: rgba(127, 29, 29, 0.95);
            border: 1px solid #fca5a5;
            color: #fef2f2;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ==========================================
           PANTALLA DE CUENTA / REGISTRO ESTILO FREE FIRE
           ========================================== */
        #auth-screen {
            position: absolute;
            inset: 0;
            z-index: 35;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px 28px;
            background: linear-gradient(180deg, rgba(12, 14, 20, 0.55) 0%, rgba(12, 14, 20, 0.86) 100%);
            color: #f8fafc;
        }
        #auth-screen.oculto {
            display: none;
        }
        .auth-header {
            text-align: center;
            margin-top: 6px;
        }
        .auth-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.4px;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85);
        }
        .auth-title span {
            color: #fbbf24;
        }
        .auth-card {
            width: 100%;
            max-width: 390px;
            background: rgba(15, 18, 26, 0.92);
            border: 1px solid rgba(245, 158, 11, 0.65);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .auth-tabs {
            display: flex;
            gap: 6px;
        }
        .auth-tab {
            flex: 1;
            padding: 7px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: #1e2430;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .auth-tab.activa {
            background: #f59e0b;
            color: #0f172a;
            border-color: #fde68a;
        }
        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .auth-field label {
            font-size: 10.5px;
            font-weight: 700;
            color: #cbd5e1;
        }
        .auth-field input {
            width: 100%;
            padding: 9px 11px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0b0e14;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
            touch-action: manipulation;
        }
        .auth-field input:focus {
            border-color: #fbbf24;
        }
        .auth-row-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10.5px;
            color: #fbbf24;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 9px;
            border-radius: 6px;
        }
        .btn-auth-principal {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #fde68a;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #0f172a;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.7px;
            cursor: pointer;
        }
        .auth-msg {
            font-size: 11px;
            font-weight: 700;
            color: #86efac;
            text-align: center;
            min-height: 15px;
        }
        .tap-to-play-box {
            width: 100%;
            max-width: 390px;
            text-align: center;
        }
        #btn-tocar-lobby {
            width: 100%;
            padding: 12px 18px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(15, 18, 26, 0.88);
            color: #fde68a;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.3px;
            cursor: pointer;
            animation: pulsoSuave 1.6s infinite;
        }
        @keyframes pulsoSuave {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(251, 191, 36, 0); }
            50% { transform: scale(1.02); box-shadow: 0 0 16px rgba(251, 191, 36, 0.35); }
        }

        /* ==========================================
           LOBBY TÁCTICO ESTILO SHOOTER
           ========================================== */
        #lobby-screen {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 20;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 12px 24px;
            background: radial-gradient(circle at 50% 45%, rgba(249, 115, 22, 0.08), rgba(10, 12, 16, 0.35) 78%);
            pointer-events: none;
        }
        #lobby-screen.activo {
            display: flex;
        }

        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .profile-badge {
            background: rgba(15, 18, 24, 0.9);
            border: 1px solid rgba(245, 158, 11, 0.85);
            border-radius: 6px;
            padding: 5px 9px;
            color: #f8fafc;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .uid-tag {
            color: #fbbf24;
            font-size: 10px;
            font-weight: 800;
        }
        .currency-pill {
            background: rgba(15, 18, 24, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 800;
            color: #fbbf24;
        }
        .currency-pill.dia {
            color: #7dd3fc;
            border-color: rgba(125, 211, 252, 0.5);
        }
        .zeta-logo {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: #fbbf24;
            background: rgba(15, 18, 24, 0.9);
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.75);
            text-transform: uppercase;
        }

        .lobby-middle {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            pointer-events: none;
        }
        .side-menu-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(15, 18, 24, 0.88);
            border-left: 3px solid #f59e0b;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 0 6px 6px 0;
            color: #f8fafc;
            font-size: 10.5px;
            font-weight: 800;
            padding: 6px 10px;
            text-align: left;
            cursor: pointer;
            min-width: 106px;
            letter-spacing: 0.4px;
        }
        .side-btn:active {
            background: rgba(245, 158, 11, 0.3);
        }

        .friends-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .friend-item {
            background: rgba(15, 18, 24, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            padding: 4px 8px;
            color: #e2e8f0;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot-online {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }

        .lobby-bottom {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            pointer-events: auto;
        }
        .play-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }
        .mode-box {
            flex: 1;
            background: rgba(15, 18, 24, 0.92);
            border: 1px solid rgba(245, 158, 11, 0.65);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        .mode-pill {
            flex: 1;
            border: none;
            border-radius: 5px;
            padding: 5px 6px;
            font-size: 9px;
            font-weight: 800;
            background: #1e242d;
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
        }
        .mode-pill.activo {
            background: #f59e0b;
            color: #0f172a;
        }
        .mode-sub {
            font-size: 9.5px;
            color: #fcd34d;
            font-weight: 700;
        }
        #btn-iniciar-juego {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #0f172a;
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.9px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
            flex-shrink: 0;
        }
        #btn-iniciar-juego:active {
            transform: scale(0.96);
        }

        .bottom-tabs {
            display: flex;
            gap: 6px;
            background: rgba(15, 18, 24, 0.92);
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            justify-content: space-between;
        }
        .tab-btn {
            flex: 1;
            background: rgba(30, 36, 45, 0.95);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 6px;
            padding: 6px 6px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn:active {
            background: #f59e0b;
            color: #0f172a;
        }

        /* ==========================================
           PANTALLAS DE MENÚ
           ========================================== */
        #menu-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 45;
            background: linear-gradient(135deg, rgba(15, 18, 24, 0.97), rgba(34, 24, 18, 0.97));
            flex-direction: column;
            padding: 12px 14px;
            color: #f8fafc;
        }
        #menu-modal.abierto {
            display: flex;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(245, 158, 11, 0.35);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 15px;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: 0.6px;
        }
        .modal-top-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cerrar-modal {
            background: rgba(220, 38, 38, 0.25);
            border: 1px solid #f87171;
            color: #fecaca;
            border-radius: 6px;
            width: 32px;
            height: 32px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }
        .modal-body {
            flex: 1;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
            overflow-y: auto;
        }
        .modal-cats {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cat-item {
            background: rgba(30, 36, 45, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 7px 8px;
            font-size: 10.5px;
            font-weight: 800;
            color: #e2e8f0;
            text-align: left;
            cursor: pointer;
        }
        .cat-item.activa {
            background: #f59e0b;
            color: #0f172a;
        }
        .modal-content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 8px;
            align-content: start;
        }
        .item-card {
            background: rgba(30, 36, 45, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }
        .item-badge {
            font-size: 18px;
        }
        .item-name {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }
        .item-desc {
            font-size: 9.5px;
            color: #cbd5e1;
        }
        .item-action {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            padding: 5px 7px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
        }
        .modal-status-msg {
            font-size: 11px;
            color: #fcd34d;
            font-weight: 700;
            min-height: 16px;
            margin-top: 6px;
        }

        /* ==========================================
           INTERFAZ EN PARTIDA
           ========================================== */
        #gameplay-ui {
            display: none;
        }
        #gameplay-ui.activo {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            border: 1.5px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #ef4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: rgba(15, 18, 24, 0.84);
            border: 1px solid rgba(245, 158, 11, 0.72);
            border-radius: 8px;
            padding: 7px 12px;
            color: #fbbf24;
            font-weight: 700;
            font-size: 13px;
        }
        #hud-hp {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: 185px;
            background: rgba(15, 18, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            padding: 6px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #1e242d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #15803d, #4ade80);
        }
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 56%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(15, 18, 24, 0.65);
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(245, 158, 11, 0.42);
            border-color: #fbbf24;
        }
        #btn-disparo {
            bottom: 42px;
            right: 24px;
            background: rgba(185, 28, 28, 0.82);
            border-color: #fca5a5;
            width: 78px;
            height: 78px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 60px;
            right: 116px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.38);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 132px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 126px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-color: #fbbf24;
            background: rgba(217, 119, 6, 0.42);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 184px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(2, 132, 199, 0.42);
        }
        #btn-recargar {
            bottom: 182px;
            right: 112px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        #joystick-base {
            position: absolute;
            bottom: 50px;
            left: 34px;
            width: 114px;
            height: 114px;
            background: rgba(15, 18, 24, 0.42);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #fde68a, #d97706);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="error-banner"></div>

        <!-- PANTALLA DE CUENTA / REGISTRO -->
        <div id="auth-screen">
            <div class="auth-header">
                <div class="auth-badge">ACCESO DE JUGADOR</div>
                <div class="auth-title">ZETA <span>BATTLE</span></div>
            </div>

            <div class="auth-card">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab activa" id="tab-crear-cuenta">CREAR CUENTA</button>
                    <button type="button" class="auth-tab" id="tab-iniciar-cuenta">INICIAR SESIÓN</button>
                </div>

                <div class="auth-row-info">
                    <span>ID ASIGNADO: <strong id="auth-uid-preview">ZB-104821</strong></span>
                    <button type="button" id="btn-nuevo-uid" style="background:#1e293b;color:#fde68a;border:1px solid #f59e0b;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:800;cursor:pointer;">CAMBIAR ID</button>
                </div>

                <div class="auth-field">
                    <label for="auth-nombre-input">Apodo o nombre en el juego</label>
                    <input type="text" id="auth-nombre-input" maxlength="16" placeholder="Ej: ZetaPro_VE" autocomplete="off">
                </div>

                <div class="auth-field">
                    <label for="auth-pin-input">PIN o clave rápida (4 a 12 caracteres)</label>
                    <input type="password" id="auth-pin-input" maxlength="12" placeholder="Crea o escribe tu PIN" autocomplete="off">
                </div>

                <button type="button" class="btn-auth-principal" id="btn-guardar-cuenta">GUARDAR Y PREPARAR CUENTA</button>
                <div class="auth-msg" id="auth-status-msg"></div>
            </div>

            <div class="tap-to-play-box">
                <button type="button" id="btn-tocar-lobby">TOCAR PARA ENTRAR AL LOBBY</button>
            </div>
        </div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="lobby-top">
                <div class="top-left-group">
                    <div class="profile-badge" id="lobby-player-btn" title="Toca para ver/cambiar tu cuenta">
                        👤 <span id="lobby-nombre">Jugador_1</span>
                        <span class="uid-tag" id="lobby-uid">#ZB-104821</span>
                        ✏️
                    </div>
                    <div class="currency-pill">🪙 <span id="lobby-oro">9,947</span></div>
                    <div class="currency-pill dia">💎 <span id="lobby-diamantes">85</span></div>
                </div>

                <div class="top-right-brand">
                    <div class="zeta-logo">ZETA BATTLE</div>
                </div>
            </div>

            <div class="lobby-middle">
                <div class="side-menu-left">
                    <button class="side-btn" data-menu="TIENDA">🛒 TIENDA</button>
                    <button class="side-btn" data-menu="RULETA">🎰 RULETA</button>
                    <button class="side-btn" data-menu="PASE">🎟️ PASE</button>
                    <button class="side-btn" data-menu="MISIONES">📋 MISIONES</button>
                    <button class="side-btn" data-menu="EVENTOS">🎉 EVENTOS</button>
                </div>

                <div class="friends-panel">

            mostrarError('Error en script: ' + (e.message || 'revisa la consola'));
        });

        function cargarThreeYArrancar() {
            const urls = [
                'https://unpkg.com/three@0.160.0/build/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'
            ];

            function intentar(idx) {
                if (window.THREE) {
                    iniciarJuego();
                    return;
                }
                if (idx >= urls.length) {
                    mostrarError('No se pudo cargar Three.js desde internet. Revisa tu conexión.');
                    return;
                }
                const s = document.createElement('script');
                s.src = urls[idx];
                s.onload = () => {
                    if (window.THREE) iniciarJuego();
                    else intentar(idx + 1);
                };
                s.onerror = () => intentar(idx + 1);
                document.head.appendChild(s);
            }

            intentar(0);
        }

            const container = document.getElementById('game-container');
            const authScreen = document.getElementById('auth-screen');
            const lobbyScreen = document.getElementById('lobby-screen');
            const gameplayUi = document.getElementById('gameplay-ui');

            let enPantallaCuenta = true;
            let enLobby = false;
            let menuAbierto = false;

            // SISTEMA DE CUENTAS DE JUGADOR
            // ==========================================

            const STORAGE_SESSION_KEY = 'zeta_battle_sesion_v1';

            function generarUid() {

                    return;

                    authStatusMsg.textContent = 'Escribe un PIN de al menos 4 caracteres.';
                    return;
                }

                const cuentas = leerCuentas();
                const clave = nombreLimpio.toLowerCase();

                if (modoAuth === 'login') {

                        authStatusMsg.style.color = '#fca5a5';
                        authStatusMsg.textContent = 'No existe una cuenta con ese nombre aquí. Cambia a CREAR CUENTA.';
                        return;

                    if (cuentas[clave].pin !== pinLimpio) {
                        authStatusMsg.style.color = '#fca5a5';
                        authStatusMsg.textContent = 'PIN incorrecto para esta cuenta.';
                        return;
                    }
                    aplicarDatosCuenta(cuentas[clave]);

                    authStatusMsg.textContent = `Sesión iniciada: ${nombreJugador} (#${uidActual})`;

                        nombre: nombreLimpio,
                        pin: pinLimpio,
                        oro: cuentas[clave]?.oro ?? 9947,
                        diamantes: cuentas[clave]?.diamantes ?? 85,
                        arma: cuentas[clave]?.arma ?? 'Rifle AR Zeta',
                        preset: cuentas[clave]?.preset ?? 'Táctico 3 Dedos',
                        gloo: cuentas[clave]?.gloo ?? 3

                    cuentas[clave] = nuevaCuenta;
                    guardarCuentas(cuentas);
                    localStorage.setItem(STORAGE_SESSION_KEY, clave);
                    aplicarDatosCuenta(nuevaCuenta);
                    persistirProgresoCuenta();
                    authStatusMsg.style.color = '#86efac';
                    authStatusMsg.textContent = `Cuenta creada: ${nombreJugador} (#${uidActual})`;
                }
            });

            function pasarAlLobbyDesdeCuenta() {
                const nombreEscrito = (authNombreInput.value || '').trim().slice(0, 16);

                    nombreJugador = nombreEscrito;

                    const clave = nombreJugador.toLowerCase();

                            nombre: nombreJugador,
                            pin: authPinInput.value.trim() || '1234',
                            oro,
                            diamantes,
                            arma: armaEquipada,
                            preset: presetActivo,
                            gloo: glooRestantes

                    localStorage.setItem(STORAGE_SESSION_KEY, clave);

                    lobbyUidEl.textContent = '#' + uidActual;
                    hudNombreEl.textContent = nombreJugador;
                }
                enPantallaCuenta = false;
                enLobby = true;
                authScreen.classList.add('oculto');
                lobbyScreen.classList.add('activo');
            }

            const btnTocarLobby = document.getElementById('btn-tocar-lobby');

                modalStatus.textContent = '';
                modalCats.querySelectorAll('.cat-item').forEach((el) => {
                    el.classList.toggle('activa', el.dataset.cat === catName);
                });
                modalGrid.innerHTML = '';
                const lista = datosMenus[menuKey].items[catName] || [];
                lista.forEach((item) => {

                    card.className = 'item-card';
                    card.innerHTML = `

                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        <button class="item-action">${item.btn}</button>

            function crearTexturaSueloTactico() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#5c4d3c';
                ctx.fillRect(0, 0, 512, 512);

                const parches = ['#4f4234', '#6b5945', '#495238', '#3e352b', '#75634e'];
                for (let i = 0; i < 650; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const rx = 6 + Math.random() * 24;
                    const ry = 4 + Math.random() * 18;
                    ctx.fillStyle = parches[Math.floor(Math.random() * parches.length)];
                    ctx.globalAlpha = 0.28;
                    ctx.beginPath();
                    ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 0.45;
                for (let i = 0; i < 4500; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const r = 0.7 + Math.random() * 2.2;
                    ctx.fillStyle = Math.random() > 0.5 ? '#2c251e' : '#8a765e';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 0.35;
                ctx.strokeStyle = '#262019';
                ctx.lineWidth = 1.2;
                for (let i = 0; i < 32; i++) {
                    let gx = Math.random() * 512;
                    let gy = Math.random() * 512;
                    ctx.beginPath();
                    ctx.moveTo(gx, gy);
                    for (let s = 0; s < 5; s++) {
                        gx += (Math.random() - 0.5) * 28;
                        gy += (Math.random() - 0.5) * 28;
                        ctx.lineTo(gx, gy);
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(26, 26);
                return tex;
            }

            function crearTexturaConcreto() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#7c7872';
                ctx.fillRect(0, 0, 256, 256);

                for (let i = 0; i < 1800; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(30,30,30,0.16)' : 'rgba(220,215,205,0.12)';
                    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 4, 2 + Math.random() * 4);
                }

                ctx.strokeStyle = 'rgba(35,32,30,0.35)';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < 10; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * 256, Math.random() * 256);
                    ctx.lineTo(Math.random() * 256, Math.random() * 256);
                    ctx.stroke();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                return tex;
            }

            function crearTexturaTelaTactica() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#252b33';
                ctx.fillRect(0, 0, 128, 128);
                for (let y = 0; y < 128; y += 2) {
                    for (let x = 0; x < 128; x += 2) {
                        ctx.fillStyle = (x + y) % 4 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.08)';
                        ctx.fillRect(x, y, 2, 2);
                    }
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(3, 3);
                return tex;
            }

            const mochilaGrupo = new THREE.Group();
            mochilaGrupo.position.set(0, 0.44, -0.26);
            const bolsaPrincipal = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.46, 0.18), matMochila);
            bolsaPrincipal.castShadow = true;
            const bolsilloTrasero = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.24, 0.08), matPouch);
            bolsilloTrasero.position.set(0, -0.06, -0.11);
            mochilaGrupo.add(bolsaPrincipal, bolsilloTrasero);

            function construirBrazo(lado) {
                const pivote = new THREE.Group();
                pivote.position.set(lado * 0.38, 0.64, 0);

                const hombrera = new THREE.Mesh(new THREE.SphereGeometry(0.105, 12, 12), matCamisa);
                hombrera.castShadow = true;

                const brazoSup = new THREE.Mesh(new THREE.CylinderGeometry(0.086, 0.076, 0.25, 12), matCamisa);
                brazoSup.position.set(0, -0.13, 0);
                brazoSup.castShadow = true;

                const codera = new THREE.Mesh(new THREE.SphereGeometry(0.072, 10, 10), matRodillera);
                codera.position.set(0, -0.26, -0.03);

                const antebrazo = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.062, 0.23, 12), matPiel);
                antebrazo.position.set(0, -0.37, 0.02);
                antebrazo.rotation.x = -0.18;
                antebrazo.castShadow = true;

                const guante = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.11, 0.11), matGuante);
                guante.position.set(0, -0.50, 0.05);
                guante.castShadow = true;

                pivote.add(hombrera, brazoSup, codera, antebrazo, guante);
                return pivote;
            }

            const pivoteBrazoIzq = construirBrazo(-1);
            const pivoteBrazoDer = construirBrazo(1);

            const rifleGrupo = new THREE.Group();
            rifleGrupo.position.set(0.09, -0.44, 0.30);

            const matMetalOscuro = new THREE.MeshStandardMaterial({ color: 0x161a20, metalness: 0.78, roughness: 0.28 });
            const matMetalMedio = new THREE.MeshStandardMaterial({ color: 0x333c48, metalness: 0.72, roughness: 0.34 });
            const matPolimero = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: 0.65 });

            const receptor = new THREE.Mesh(new THREE.BoxGeometry(0.084, 0.125, 0.38), matMetalOscuro);
            receptor.castShadow = true;

            const tuboCulata = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.25, 8), matMetalMedio);
            tuboCulata.rotation.x = Math.PI / 2;
            tuboCulata.position.set(0, 0.015, -0.30);

            const culata = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.165, 0.20), matPolimero);
            culata.position.set(0, -0.015, -0.38);

            const empuniadura = new THREE.Mesh(new THREE.BoxGeometry(0.064, 0.145, 0.075), matPolimero);
            empuniadura.rotation.x = -0.28;
            empuniadura.position.set(0, -0.105, -0.08);

            const cargadorSup = new THREE.Mesh(new THREE.BoxGeometry(0.056, 0.135, 0.105), matMetalMedio);
            cargadorSup.rotation.x = 0.15;
            cargadorSup.position.set(0, -0.115, 0.08);

            const cargadorInf = new THREE.Mesh(new THREE.BoxGeometry(0.056, 0.135, 0.105), matMetalMedio);
            cargadorInf.rotation.x = 0.34;
            cargadorInf.position.set(0, -0.22, 0.105);

            const guardamanos = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.048, 0.36, 8), matMetalOscuro);
            guardamanos.rotation.x = Math.PI / 2;
            guardamanos.position.set(0, 0.01, 0.35);
            guardamanos.castShadow = true;

            const baseMira = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.036, 0.16), matMetalMedio);
            baseMira.position.set(0, 0.075, -0.01);
            const tuboMira = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.032, 0.19, 12), matMetalOscuro);
            tuboMira.rotation.x = Math.PI / 2;
            tuboMira.position.set(0, 0.112, -0.01);

            const canion = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.022, 0.28, 10), matMetalMedio);
            canion.rotation.x = Math.PI / 2;
            canion.position.set(0, 0.012, 0.63);

            const bocacha = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.07, 10), matMetalOscuro);
            bocacha.rotation.x = Math.PI / 2;
            bocacha.position.set(0, 0.012, 0.78);

            const puntaCanion = new THREE.Object3D();
            puntaCanion.position.set(0, 0.012, 0.84);

            const destelloDisparo = new THREE.Mesh(
                new THREE.SphereGeometry(0.17, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: 0.95 })
            );
            destelloDisparo.position.set(0, 0.012, 0.86);
            destelloDisparo.visible = false;

            rifleGrupo.add(
                receptor, tuboCulata, culata, empuniadura,
                cargadorSup, cargadorInf, guardamanos,
                baseMira, tuboMira, canion, bocacha, puntaCanion, destelloDisparo
            );
            pivoteBrazoDer.add(rifleGrupo);

            torsoGrupo.add(
                cadera, cinturon, hebilla, torsoBase, chalecoCuerpo, placaFrontal,
                radio, antenaRadio, cuello, cabezaGrupo, mochilaGrupo,
                pivoteBrazoIzq, pivoteBrazoDer
            );
            jugadorMesh.add(pivotePiernaIzq, pivotePiernaDer, torsoGrupo);
            scene.add(jugadorMesh);

            let velY = 0;
            let enSuelo = true;
            let agachado = false;
            let apuntando = false;
            let balas = 30;
            const maxBalas = 30;
            let glooRestantes = 3;
            let tiempoDestello = 0;
            let retrocesoArma = 0;
            let cicloPaso = 0;
            const proyectiles = [];

            let camYaw = 0;
            let camPitch = 0.22;
            const sensibilidad = 0.0055;

            function actualizarHUD() {
                document.getElementById('hud-municion').textContent = `Balas: ${balas}/${maxBalas} | Gloo: ${glooRestantes}`;
            }

            const joystickBase = document.getElementById('joystick-base');
            const joystickStick = document.getElementById('joystick-stick');
            let joyActivo = false, joyTouchId = null, joyX = 0, joyY = 0;
            const maxRadio = 36;

            function actualizarJoystick(touch) {
                const rect = joystickBase.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxRadio) {
                    dx = (dx / dist) * maxRadio;
                    dy = (dy / dist) * maxRadio;
                }
                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                joyX = dx / maxRadio;
                joyY = dy / maxRadio;
            }

            joystickBase.addEventListener('touchstart', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                joyActivo = true;
                joyTouchId = e.changedTouches[0].identifier;
                actualizarJoystick(e.changedTouches[0]);
            }, { passive: false });

            joystickBase.addEventListener('touchmove', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (!joyActivo) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) actualizarJoystick(t);
                }
            }, { passive: false });

            function soltarJoystick(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        joyActivo = false; joyTouchId = null; joyX = 0; joyY = 0;
                        joystickStick.style.transform = 'translate(0px, 0px)';
                    }
                }
            }
            joystickBase.addEventListener('touchend', soltarJoystick);
            joystickBase.addEventListener('touchcancel', soltarJoystick);

            const aimZone = document.getElementById('aim-zone');
            let aimTouchId = null;
            let lastAimX = 0;
            let lastAimY = 0;

            function aplicarRotacionMira(deltaX, deltaY, factorVertical = 1) {
                camYaw -= deltaX * sensibilidad;
                camPitch = Math.max(-0.22, Math.min(0.72, camPitch + deltaY * sensibilidad * factorVertical));
                jugadorMesh.rotation.y = camYaw;
            }

            aimZone.addEventListener('touchstart', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                if (aimTouchId !== null) return;
                const t = e.changedTouches[0];
                aimTouchId = t.identifier;
                lastAimX = t.clientX;
                lastAimY = t.clientY;
            }, { passive: false });

            aimZone.addEventListener('touchmove', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                if (aimTouchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === aimTouchId) {
                        const dx = t.clientX - lastAimX;
                        const dy = t.clientY - lastAimY;
                        lastAimX = t.clientX;
                        lastAimY = t.clientY;
                        aplicarRotacionMira(dx, dy, 1);
                    }
                }
            }, { passive: false });

            function soltarMira(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === aimTouchId) {
                        aimTouchId = null;
                    }
                }
            }
            aimZone.addEventListener('touchend', soltarMira);
            aimZone.addEventListener('touchcancel', soltarMira);

            const btnDisparo = document.getElementById('btn-disparo');
            let disparando = false;
            let fireTouchId = null;
            let lastFireX = 0;
            let lastFireY = 0;
            let ultimoDisparoTime = 0;
            const intervaloDisparo = 140;

            function disparar() {
                if (enLobby || enPantallaCuenta || menuAbierto || balas <= 0) return;
                balas--;
                actualizarHUD();

                destelloDisparo.visible = true;
                tiempoDestello = 45;
                retrocesoArma = 0.08;

                jugadorMesh.updateMatrixWorld(true);
                const origenCanion = new THREE.Vector3();
                puntaCanion.getWorldPosition(origenCanion);

                const puntoObjetivo = new THREE.Vector3();
                camera.getWorldDirection(puntoObjetivo);
                const distanciaMira = 45;
                puntoObjetivo.multiplyScalar(distanciaMira).add(camera.position);

                const dirDisparo = puntoObjetivo.sub(origenCanion).normalize();
                const velocidadBala = 2.1;

                const balaMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.04, 0.04, 0.65, 6),
                    new THREE.MeshBasicMaterial({ color: 0xffd166 })
                );
                balaMesh.position.copy(origenCanion);
                const up = new THREE.Vector3(0, 1, 0);
                balaMesh.quaternion.setFromUnitVectors(up, dirDisparo);

                scene.add(balaMesh);
                proyectiles.push({
                    mesh: balaMesh,
                    vx: dirDisparo.x * velocidadBala,
                    vy: dirDisparo.y * velocidadBala,
                    vz: dirDisparo.z * velocidadBala,
                    vida: 38
                });
            }

            btnDisparo.addEventListener('touchstart', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (fireTouchId !== null) return;
                const t = e.changedTouches[0];
                fireTouchId = t.identifier;
                lastFireX = t.clientX;
                lastFireY = t.clientY;
                disparando = true;
                btnDisparo.classList.add('active');
                disparar();
                ultimoDisparoTime = performance.now();
            }, { passive: false });

            btnDisparo.addEventListener('touchmove', (e) => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (!disparando || fireTouchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === fireTouchId) {
                        const dx = t.clientX - lastFireX;
                        const dy = t.clientY - lastFireY;
                        lastFireX = t.clientX;
                        lastFireY = t.clientY;
                        aplicarRotacionMira(dx * 0.55, dy * 0.55, 0.85);
                    }
                }
            }, { passive: false });

            function soltarDisparo(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === fireTouchId) {
                        disparando = false;
                        fireTouchId = null;
                        btnDisparo.classList.remove('active');
                    }
                }
            }
            btnDisparo.addEventListener('touchend', soltarDisparo);
            btnDisparo.addEventListener('touchcancel', soltarDisparo);
            btnDisparo.addEventListener('mousedown', () => {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                disparando = true;
                disparar();
                ultimoDisparoTime = performance.now();
            });
            window.addEventListener('mouseup', () => { disparando = false; });

            const btnMira = document.getElementById('btn-mira');
            function toggleMira() {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                apuntando = !apuntando;
                btnMira.classList.toggle('active', apuntando);
                crosshair.style.display = apuntando ? 'block' : 'none';
            }
            btnMira.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMira();
            }, { passive: false });
            btnMira.addEventListener('click', toggleMira);

            function ponerGloo() {
                if (enLobby || enPantallaCuenta || menuAbierto || glooRestantes <= 0) return;
                glooRestantes--;
                actualizarHUD();
                persistirProgresoCuenta();

                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
                const glooGrupo = new THREE.Group();

                const panel = new THREE.Mesh(
                    new THREE.BoxGeometry(3.3, 2.25, 0.34),
                    new THREE.MeshStandardMaterial({
                        color: 0x38bdf8,
                        emissive: 0x0284c7,
                        emissiveIntensity: 0.25,
                        transparent: true,
                        opacity: 0.68
                    })
                );
                panel.position.y = 1.12;
                panel.castShadow = true;

                glooGrupo.add(panel);
                const gx = jugadorMesh.position.x + dir.x * 3.1;
                const gz = jugadorMesh.position.z + dir.z * 3.1;
                glooGrupo.position.set(gx, 0, gz);
                glooGrupo.rotation.y = jugadorMesh.rotation.y;
                scene.add(glooGrupo);
                obstaculos.push({ x: gx, z: gz, r: 1.45 });
            }

            function recargar() {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                balas = maxBalas;
                actualizarHUD();
            }

            function saltar() {
                if (enLobby || enPantallaCuenta || menuAbierto || !enSuelo) return;
                if (agachado) agachado = false;
                velY = 0.36;
                enSuelo = false;
            }

            function toggleAgachar() {
                if (enLobby || enPantallaCuenta || menuAbierto) return;
                agachado = !agachado;
            }

            function vincularBoton(id, fn) {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    fn();
                }, { passive: false });
                el.addEventListener('click', fn);
            }

            vincularBoton('btn-gloo', ponerGloo);
            vincularBoton('btn-recargar', recargar);
            vincularBoton('btn-salto', saltar);
            vincularBoton('btn-agachar', toggleAgachar);

            let ultimoFrame = performance.now();

            function animar(ahora = performance.now()) {
                requestAnimationFrame(animar);
                const dt = Math.min(50, ahora - ultimoFrame);
                ultimoFrame = ahora;

                if (tiempoDestello > 0) {
                    tiempoDestello -= dt;
                    if (tiempoDestello <= 0) destelloDisparo.visible = false;
                }
                if (retrocesoArma > 0.001) {
                    retrocesoArma *= 0.78;
                } else {
                    retrocesoArma = 0;
                }

                if (enLobby || enPantallaCuenta) {
                    portalLobby.visible = true;
                    mascotaGrupo.visible = true;
                    portalLobby.rotation.y += dt * 0.0008;
                    mascotaGrupo.position.y = Math.abs(Math.sin(ahora * 0.004)) * 0.08;

                    jugadorMesh.rotation.y = 0.14;
                    torsoGrupo.rotation.y = -0.12;
                    torsoGrupo.rotation.x = 0.01;
                    cabezaGrupo.rotation.y = 0.12;

                    pivotePiernaIzq.rotation.x = -0.04;
                    pivotePiernaDer.rotation.x = 0.05;

                    pivoteBrazoDer.rotation.set(-0.78, -0.44, -0.22);
                    pivoteBrazoIzq.rotation.set(-0.92, 0.64, 0.22);
                    rifleGrupo.position.set(0.09, -0.44, 0.30);
                    rifleGrupo.rotation.set(0.78, 0.56, 0);

                    // Encuadre de cuerpo entero centrado en el lobby
                    camera.position.set(0.0, 1.48, 5.75);
                    camera.lookAt(0.0, 1.02, 0.0);

                    sombraJugador.position.set(jugadorMesh.position.x, 0.03, jugadorMesh.position.z);
                    renderer.render(scene, camera);
                    return;
                }

                portalLobby.visible = false;
                mascotaGrupo.visible = false;

                if (disparando && ahora - ultimoDisparoTime >= intervaloDisparo) {
                    disparar();
                    ultimoDisparoTime = ahora;
                }

                const velocidad = agachado ? 0.14 : 0.22;
                const forwardX = Math.sin(camYaw);
                const forwardZ = Math.cos(camYaw);
                const rightX = -Math.cos(camYaw);
                const rightZ = Math.sin(camYaw);

                const moveForward = -joyY;
                const moveRight = joyX;
                const intensidadMov = Math.min(1, Math.hypot(moveForward, moveRight));

                const moveVecX = forwardX * moveForward + rightX * moveRight;
                const moveVecZ = forwardZ * moveForward + rightZ * moveRight;

                const nextX = jugadorMesh.position.x + moveVecX * velocidad;
                const nextZ = jugadorMesh.position.z + moveVecZ * velocidad;

                let bloqueado = false;
                for (const obs of obstaculos) {
                    if (Math.hypot(nextX - obs.x, nextZ - obs.z) < obs.r + 0.52) {
                        bloqueado = true;
                        break;
                    }
                }

                if (!bloqueado) {
                    jugadorMesh.position.x = Math.max(-72, Math.min(72, nextX));
                    jugadorMesh.position.z = Math.max(-72, Math.min(72, nextZ));
                }

                jugadorMesh.rotation.y = camYaw;

                const targetTorsoY = agachado ? 0.52 : 0.86;
                torsoGrupo.position.y += (targetTorsoY - torsoGrupo.position.y) * 0.2;

                const targetInclinacion = agachado ? 0.28 : (apuntando ? 0.08 : (intensidadMov > 0.05 ? 0.11 : 0.03));
                torsoGrupo.rotation.x += (targetInclinacion - torsoGrupo.rotation.x) * 0.2;

                const targetGiroTorso = apuntando ? -0.22 : -0.14;
                torsoGrupo.rotation.y += (targetGiroTorso - torsoGrupo.rotation.y) * 0.2;
                cabezaGrupo.rotation.y = -torsoGrupo.rotation.y;

                const targetBrazoDerX = apuntando ? -1.46 : -1.16;
                const targetBrazoDerY = apuntando ? -0.34 : -0.48;
                const targetBrazoIzqX = apuntando ? -1.36 : -1.08;
                const targetBrazoIzqY = apuntando ? 0.62 : 0.66;

                pivoteBrazoDer.rotation.x += (targetBrazoDerX - pivoteBrazoDer.rotation.x) * 0.22;
                pivoteBrazoDer.rotation.y += (targetBrazoDerY - pivoteBrazoDer.rotation.y) * 0.22;
                pivoteBrazoDer.rotation.z = -0.24;
                pivoteBrazoIzq.rotation.x += (targetBrazoIzqX - pivoteBrazoIzq.rotation.x) * 0.22;
                pivoteBrazoIzq.rotation.y += (targetBrazoIzqY - pivoteBrazoIzq.rotation.y) * 0.22;
                pivoteBrazoIzq.rotation.z = 0.22;

                rifleGrupo.rotation.set(-pivoteBrazoDer.rotation.x, 0.48, 0);
                rifleGrupo.position.set(0.09, -0.44, 0.30 - retrocesoArma);

                if (intensidadMov > 0.05 && enSuelo) {
                    cicloPaso += dt * 0.015 * intensidadMov;
                    const angPierna = Math.sin(cicloPaso) * 0.65 * intensidadMov;
                    pivotePiernaIzq.rotation.x = angPierna;
                    pivotePiernaDer.rotation.x = -angPierna;
                    torsoGrupo.position.y += Math.abs(Math.cos(cicloPaso)) * 0.025 * intensidadMov;
                } else {
                    pivotePiernaIzq.rotation.x *= 0.8;
                    pivotePiernaDer.rotation.x *= 0.8;
                }

                if (!enSuelo) {
                    jugadorMesh.position.y += velY;
                    velY -= 0.015;
                    if (jugadorMesh.position.y <= 0) {
                        jugadorMesh.position.y = 0;
                        velY = 0;
                        enSuelo = true;
                    }
                }

                sombraJugador.position.x = jugadorMesh.position.x;
                sombraJugador.position.z = jugadorMesh.position.z;
                const escalaSombra = Math.max(0.35, 1 - jugadorMesh.position.y * 0.14);
                sombraJugador.scale.set(escalaSombra, escalaSombra, 1);

                for (let i = proyectiles.length - 1; i >= 0; i--) {
                    const p = proyectiles[i];
                    p.mesh.position.x += p.vx;
                    p.mesh.position.y += p.vy;
                    p.mesh.position.z += p.vz;
                    p.vida--;
                    if (p.vida <= 0) {
                        scene.remove(p.mesh);
                        proyectiles.splice(i, 1);
                    }
                }

                const targetFov = apuntando ? 42 : 60;
                if (Math.abs(camera.fov - targetFov) > 0.2) {
                    camera.fov += (targetFov - camera.fov) * 0.18;
                    camera.updateProjectionMatrix();
                }

                const baseDist = apuntando ? 6.8 : 8.4;
                const alturaCam = (apuntando ? 3.15 : 2.15) + Math.sin(camPitch) * baseDist;
                let horizDist = Math.cos(camPitch) * baseDist;

                const dirAtrasX = -Math.sin(camYaw);
                const dirAtrasZ = -Math.cos(camYaw);
                const hombroOffset = apuntando ? 1.55 : 0.45;

                for (let paso = 0.25; paso <= 1.0; paso += 0.25) {
                    const dPrueba = horizDist * paso;
                    const cx = jugadorMesh.position.x + dirAtrasX * dPrueba + rightX * (hombroOffset * paso);
                    const cz = jugadorMesh.position.z + dirAtrasZ * dPrueba + rightZ * (hombroOffset * paso);
                    for (const obs of obstaculos) {
                        const distObs = Math.hypot(cx - obs.x, cz - obs.z);
                        if (distObs < obs.r + 1.05) {
                            horizDist = Math.min(horizDist, Math.max(2.6, dPrueba - 1.1));
                        }
                    }
                }

                const camTargetX = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                const camTargetY = jugadorMesh.position.y + alturaCam;
                const camTargetZ = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;

                camera.position.lerp(new THREE.Vector3(camTargetX, camTargetY, camTargetZ), 0.18);
                camera.lookAt(
                    jugadorMesh.position.x + Math.sin(camYaw) * 6 + rightX * (apuntando ? 0.5 : 0),
                    jugadorMesh.position.y + (apuntando ? 1.9 : 1.5) + Math.sin(camPitch) * 3,
                    jugadorMesh.position.z + Math.cos(camYaw) * 6 + rightZ * (apuntando ? 0.5 : 0)
                );

                renderer.render(scene, camera);
            }

            animar();
        }

        cargarThreeYArrancar();
