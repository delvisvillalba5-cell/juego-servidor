<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZETA BATTLE - Lobby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      color: #fff;
    }

    /* MENÚ DE INICIO */
    #startMenu {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2430 0%, #0b0c10 100%);
      z-index: 10;
    }
    #startMenu h1 {
      font-size: 2.5rem;
      color: #ff9900;
      text-shadow: 0 0 15px rgba(255, 153, 0, 0.7);
      margin-bottom: 5px;
    }
    .enter-btn {
      margin-top: 25px;
      padding: 12px 35px;
      background: #ff4757;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
      cursor: pointer;
    }

    /* PANTALLA DE LOBBY (ESTILO FREE FIRE) */
    #lobbyScreen {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
      background: #11141a;
    }

    #lobbyCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* INTERFAZ DEL LOBBY (HUD) */
    .top-left-profile {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .avatar-icon {
      width: 35px;
      height: 35px;
      background: #ff9900;
      border-radius: 50%;
    }

    .side-menu {
      position: absolute;
      left: 15px;
      top: 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .side-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .bottom-right-panel {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .mode-selector {
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ff9900;
      border: 1px solid #ff9900;
    }
    .start-match-btn {
      background: #2ed573;
      color: #000;
      border: none;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(46, 213, 115, 0.5);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL -->
  <div id="startMenu">
    <h1>ZETA BATTLE</h1>
    <p>Toca para ingresar al lobby</p>
    <button class="enter-btn" onclick="enterLobby()">INICIAR SESIÓN</button>
  </div>

  <!-- PANTALLA DE LOBBY -->
  <div id="lobbyScreen">
    <canvas id="lobbyCanvas"></canvas>

    <!-- PERFIL -->
    <div class="top-left-profile">
      <div class="avatar-icon"></div>
      <div>
        <div style="font-weight: bold; font-size: 0.85rem;">Jugador_1</div>
        <div style="font-size: 0.7rem; color: #aaa;">Nivel 15</div>
      </div>
    </div>

    <!-- MENÚ LATERAL IZQUIERDO -->
    <div class="side-menu">
      <button class="side-btn">TIENDA</button>
      <button class="side-btn">ARMAS</button>
      <button class="side-btn">INVENTARIO</button>
      <button class="side-btn">MASCOTA</button>
    </div>

    <!-- BOTÓN INICIAR Y MODO DE JUEGO -->
    <div class="bottom-right-panel">
      <div class="mode-selector">DE-CLASIFICATORIA (4v4)</div>
      <button class="start-match-btn" onclick="startBattle()">INICIAR</button>
    </div>
  </div>

  <script>
    const startMenu = document.getElementById('startMenu');
    const lobbyScreen = document.getElementById('lobbyScreen');
    const canvas = document.getElementById('lobbyCanvas');
    const ctx = canvas.getContext('2d');

    function enterLobby() {
      startMenu.style.display = 'none';
      lobbyScreen.style.display = 'block';

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      renderLobbyScene();
    }

    function renderLobbyScene() {
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 50;

        // Plataforma central brillante
        ctx.fillStyle = 'rgba(255, 153, 0, 0.2)';
        ctx.beginPath();
        ctx.ellipse(centerX, centerY + 80, 120, 30, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff9900';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Avatar (Representación del personaje)
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(centerX, centerY - 20, 25, 0, Math.PI * 2); // Cabeza
        ctx.fill();

        ctx.fillStyle = '#2f3542';
        ctx.fillRect(centerX - 20, centerY + 5, 40, 60); // Cuerpo

        // Mascota al lado
        ctx.fillStyle = '#eccc68';
        ctx.beginPath();
        ctx.arc(centerX + 60, centerY + 65, 15, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(draw);
      }
      draw();
    }

    function startBattle() {
      alert('¡Buscando partida estilo Battle Royale / 4v4!');
    }
  </script>
</body>
</html>
