<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1b4b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #error-banner {
            display: none;
            position: absolute;
            top: 66px;
            left: 14px;
            right: 14px;
            z-index: 40;
            background: rgba(127, 29, 29, 0.92);
            border: 1px solid #fca5a5;
            color: #fef2f2;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ==========================================
           LOBBY ESTILO FREE FIRE (HORIZONTAL / MÓVIL)
           ========================================== */
        #lobby-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 14px 14px;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.05) 50%, rgba(15, 23, 42, 0.5) 100%);
            pointer-events: none;
        }
        #lobby-screen.oculto {
            display: none;
        }

        /* Barra superior */
        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .profile-badge {
            background: rgba(15, 23, 42, 0.86);
            border: 1px solid rgba(250, 204, 21, 0.75);
            border-radius: 8px;
            padding: 5px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .currency-pill {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 800;
            color: #fde047;
        }
        .currency-pill.dia {
            color: #7dd3fc;
            border-color: rgba(125, 211, 252, 0.5);
        }
        .top-right-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zeta-logo {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #facc15;
            background: rgba(15, 23, 42, 0.85);
            padding: 5px 11px;
            border-radius: 8px;
            border: 1px solid rgba(250, 204, 21, 0.6);
        }

        /* Zona media: menú izquierdo + lista derecha */
        .lobby-middle {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            pointer-events: none;
        }
        .side-menu-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(15, 23, 42, 0.82);
            border-left: 3px solid #facc15;
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 0 8px 8px 0;
            color: #f8fafc;
            font-size: 11px;
            font-weight: 800;
            padding: 7px 11px;
            text-align: left;
            cursor: pointer;
            min-width: 112px;
        }
        .side-btn:active {
            background: rgba(250, 204, 21, 0.28);
        }

        .friends-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
            max-height: 175px;
            overflow: hidden;
        }
        .friend-item {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            padding: 4px 8px;
            color: #e2e8f0;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot-online {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
        }

        /* Barra inferior */
        .lobby-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .bottom-tabs {
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.86);
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .tab-btn:active {
            background: #facc15;
            color: #0f172a;
        }

        .play-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .mode-box {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(250, 204, 21, 0.55);
            border-radius: 9px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        .mode-pill {
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 800;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer;
        }
        .mode-pill.activo {
            background: #facc15;
            color: #0f172a;
        }
        .mode-sub {
            font-size: 10px;
            color: #fde047;
            font-weight: 700;
        }
        #btn-iniciar-juego {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            border: 2px solid #fef9c3;
            border-radius: 10px;
            padding: 12px 26px;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }
        #btn-iniciar-juego:active {
            transform: scale(0.96);
        }

        /* Toast informativo */
        #lobby-toast {
            position: absolute;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #facc15;
            color: #fef08a;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            display: none;
            pointer-events: none;
        }

        /* ==========================================
           INTERFAZ EN PARTIDA
           ========================================== */
        #gameplay-ui {
            display: none;
        }
        #gameplay-ui.activo {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #ff3b30;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(250, 204, 21, 0.7);
            border-radius: 10px;
            padding: 7px 12px;
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
        }
        #hud-hp {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
        }
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 56%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(15, 23, 42, 0.58);
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(250, 204, 21, 0.4);
            border-color: #facc15;
        }
        #btn-disparo {
            bottom: 42px;
            right: 24px;
            background: rgba(220, 38, 38, 0.78);
            border-color: #ff6b6b;
            width: 78px;
            height: 78px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 60px;
            right: 116px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.4);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 132px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 126px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-color: #facc15;
            background: rgba(202, 138, 4, 0.42);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 184px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.42);
        }
        #btn-recargar {
            bottom: 182px;
            right: 112px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        #joystick-base {
            position: absolute;
            bottom: 50px;
            left: 34px;
            width: 114px;
            height: 114px;
            background: rgba(15, 23, 42, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #fef08a, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="error-banner"></div>
        <div id="lobby-toast"></div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="lobby-top">
                <div class="top-left-group">
                    <div class="profile-badge" id="lobby-player-btn">
                        👤 <span id="lobby-nombre">Jugador_1</span> ✏️
                    </div>
                    <div class="currency-pill">🪙 9,947</div>
                    <div class="currency-pill dia">💎 85</div>
                </div>

                <div class="top-right-brand">
                    <div class="zeta-logo">ZETA BATTLE</div>
                </div>
            </div>

            <div class="lobby-middle">
                <div class="side-menu-left">
                    <button class="side-btn" data-toast="Tienda: Próximamente">🛒 TIENDA</button>
                    <button class="side-btn" data-toast="Ruleta: Próximamente">🎰 RULETA</button>
                    <button class="side-btn" data-toast="Pase: Temporada Zeta">🎟️ PASE</button>
                    <button class="side-btn" data-toast="Misiones: 3 activas">📋 MISIONES</button>
                    <button class="side-btn" data-toast="Eventos: Arena Zeta">🎉 EVENTOS</button>
                </div>

                <div class="friends-panel">
                    <div class="friend-item"><span class="dot-online"></span> ZetaPro_VE</div>
                    <div class="friend-item"><span class="dot-online"></span> SombraBR</div>
                    <div class="friend-item"><span class="dot-online"></span> NovaX</div>
                </div>
            </div>

            <div class="lobby-bottom">
                <div class="bottom-tabs">
                    <button class="tab-btn" data-toast="Inventario: Rifle AR + 3 Gloo">🎒 INVENTARIO</button>
                    <button class="tab-btn" data-toast="Armas: Rifle de Asalto equipado">🔫 ARMAS</button>
                    <button class="tab-btn" data-toast="Preset: Configuración Táctica">⚙️ PRESET</button>
                </div>

                <div class="play-box">
                    <div class="mode-box">
                        <div class="mode-buttons">
                            <button class="mode-pill activo" data-modo="BR-CLASIFICATORIA">BR-CLASIFICATORIA</button>
                            <button class="mode-pill" data-modo="1V1 DUELO">1V1 DUELO</button>
                        </div>
                        <div class="mode-sub" id="lobby-submodo">Mapa aleatorio • Listo</div>
                    </div>
                    <button id="btn-iniciar-juego">INICIAR</button>
                </div>
            </div>
        </div>

        <!-- PARTIDA -->
        <div id="gameplay-ui">
            <div id="crosshair"></div>

            <div id="hud-top">
                <div class="player-card">
                    👤 <span id="hud-nombre">Jugador_1</span><br>
                    <span id="hud-municion" style="font-size:11px; color:#f8fafc;">Balas: 30/30 | Gloo: 3</span>
                </div>
                <div class="player-card" id="hud-vivos">vivo: 12 / 50</div>
            </div>

            <div id="hud-hp">
                HP 200 / 200
                <div class="hp-track"><div class="hp-bar"></div></div>
            </div>

            <div class="controls-layer">
                <div id="aim-zone"></div>
                <div id="joystick-base"><div id="joystick-stick"></div></div>

                <div class="touch-btn" id="btn-recargar">🔄</div>
                <div class="touch-btn" id="btn-gloo">🧊</div>
                <div class="touch-btn" id="btn-agachar">⬇️</div>
                <div class="touch-btn" id="btn-salto">🦘</div>
                <div class="touch-btn" id="btn-mira">🔍</div>
                <div class="touch-btn" id="btn-disparo">🎯</div>
            </div>
        </div>
    </div>

    <script>
        const errorBanner = document.getElementById('error-banner');
        function mostrarError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
        }
        window.addEventListener('error', (e) => {
            mostrarError('Error en script: ' + (e.message || 'revisa la consola'));
        });

        function cargarThreeYArrancar() {
            const urls = [
                'https://unpkg.com/three@0.160.0/build/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'
            ];

            function intentar(idx) {
                if (window.THREE) {
                    iniciarJuego();
                    return;
                }
                if (idx >= urls.length) {
                    mostrarError('No se pudo cargar Three.js desde internet. Revisa tu conexión.');
                    return;
                }
                const s = document.createElement('script');
                s.src = urls
