<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1b4b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #1e40af 0%, #38bdf8 56%, #2f6f22 100%);
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #status-pill {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(250, 204, 21, 0.8);
            color: #fef08a;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 10.5px;
            font-weight: 800;
            white-space: nowrap;
        }

        #lobby-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 12px 24px;
            background: transparent;
            pointer-events: none;
        }
        #lobby-screen.oculto {
            display: none;
        }

        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .profile-badge {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(250, 204, 21, 0.8);
            border-radius: 8px;
            padding: 5px 9px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .currency-pill {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 800;
            color: #fde047;
        }
        .currency-pill.dia {
            color: #7dd3fc;
            border-color: rgba(125, 211, 252, 0.55);
        }
        .zeta-logo {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #facc15;
            background: rgba(15, 23, 42, 0.88);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(250, 204, 21, 0.65);
        }

        .lobby-middle {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            pointer-events: none;
        }
        .side-menu-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(15, 23, 42, 0.86);
            border-left: 3px solid #facc15;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            border-right: 1px solid rgba(255, 255, 255, 0.16);
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 0 8px 8px 0;
            color: #f8fafc;
            font-size: 10.5px;
            font-weight: 800;
            padding: 6px 10px;
            text-align: left;
            cursor: pointer;
            min-width: 104px;
        }
        .side-btn:active {
            background: rgba(250, 204, 21, 0.32);
        }

        .friends-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .friend-item {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 7px;
            padding: 4px 8px;
            color: #e2e8f0;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot-online {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
        }

        .lobby-bottom {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            pointer-events: auto;
        }
        .play-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }
        .mode-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(250, 204, 21, 0.65);
            border-radius: 9px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        .mode-pill {
            flex: 1;
            border: none;
            border-radius: 6px;
            padding: 5px 6px;
            font-size: 9px;
            font-weight: 800;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
        }
        .mode-pill.activo {
            background: #facc15;
            color: #0f172a;
        }
        .mode-sub {
            font-size: 9.5px;
            color: #fde047;
            font-weight: 700;
        }
        #btn-iniciar-juego {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            border: 2px solid #fef9c3;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
            flex-shrink: 0;
        }
        #btn-iniciar-juego:active {
            transform: scale(0.96);
        }

        .bottom-tabs {
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.9);
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            justify-content: space-between;
        }
        .tab-btn {
            flex: 1;
            background: rgba(30, 41, 59, 0.92);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            padding: 6px 6px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn:active {
            background: #facc15;
            color: #0f172a;
        }

        #menu-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.97), rgba(30, 27, 75, 0.97));
            flex-direction: column;
            padding: 12px 14px;
            color: #f8fafc;
        }
        #menu-modal.abierto {
            display: flex;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(250, 204, 21, 0.35);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 15px;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 0.6px;
        }
        .modal-top-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cerrar-modal {
            background: rgba(239, 68, 68, 0.25);
            border: 1px solid #f87171;
            color: #fecaca;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }
        .modal-body {
            flex: 1;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
            overflow-y: auto;
        }
        .modal-cats {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cat-item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 7px 8px;
            font-size: 10.5px;
            font-weight: 800;
            color: #e2e8f0;
            text-align: left;
            cursor: pointer;
        }
        .cat-item.activa {
            background: #facc15;
            color: #0f172a;
        }
        .modal-content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 8px;
            align-content: start;
        }
        .item-card {
            background: rgba(30, 41, 59, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 9px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }
        .item-badge {
            font-size: 18px;
        }
        .item-name {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }
        .item-desc {
            font-size: 9.5px;
            color: #cbd5e1;
        }
        .item-action {
            background: #facc15;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 5px 7px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
        }
        .modal-status-msg {
            font-size: 11px;
            color: #fde047;
            font-weight: 700;
            min-height: 16px;
            margin-top: 6px;
        }

        #gameplay-ui {
            display: none;
        }
        #gameplay-ui.activo {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #ff3b30;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(250, 204, 21, 0.7);
            border-radius: 10px;
            padding: 7px 12px;
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
        }
        #hud-hp {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
        }
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 56%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(15, 23, 42, 0.58);
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(250, 204, 21, 0.4);
            border-color: #facc15;
        }
        #btn-disparo {
            bottom: 42px;
            right: 24px;
            background: rgba(220, 38, 38, 0.78);
            border-color: #ff6b6b;
            width: 78px;
            height: 78px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 60px;
            right: 116px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.4);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 132px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 126px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-color: #facc15;
            background: rgba(202, 138, 4, 0.42);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 184px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.42);
        }
        #btn-recargar {
            bottom: 182px;
            right: 112px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        #joystick-base {
            position: absolute;
            bottom: 50px;
            left: 34px;
            width: 114px;
            height: 114px;
            background: rgba(15, 23, 42, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #fef08a, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="status-pill">ZETA LIVE • CARGANDO 3D...</div>

        <div id="lobby-screen">
            <div class="lobby-top">
                <div class="top-left-group">
                    <div class="profile-badge" id="lobby-player-btn">
                        👤 <span id="lobby-nombre">Jugador_1</span> ✏️
                    </div>
                    <div class="currency-pill">🪙 <span id="lobby-oro">9,947</span></div>
                    <div class="currency-pill dia">💎 <span id="lobby-diamantes">85</span></div>
                </div>

                <div class="top-right-brand">
                    <div class="zeta-logo">ZETA BATTLE</div>
                </div>
            </div>

            <div class="lobby-middle">
                <div class="side-menu-left">
                    <button class="side-btn" data-menu="TIENDA">🛒 TIENDA</button>
                    <button class="side-btn" data-menu="RULETA">🎰 RULETA</button>
                    <button class="side-btn" data-menu="PASE">🎟️ PASE</button>
                    <button class="side-btn" data-menu="MISIONES">📋 MISIONES</button>
                    <button class="side-btn" data-menu="EVENTOS">🎉 EVENTOS</button>
                </div>

                <div class="friends-panel">
                    <div class="friend-item"><span class="dot-online"></span> ZetaPro_VE</div>
                    <div class="friend-item"><span class="dot-online"></span> SombraBR</div>
                    <div class="friend-item"><span class="dot-online"></span> NovaX</div>
                </div>
            </div>

            <div class="lobby-bottom">
                <div class="play-box">
                    <div class="mode-box">
                        <div class="mode-buttons">
                            <button class="mode-pill activo" data-modo="BR-CLASIFICATORIA">BR-CLASIFICATORIA</button>
                            <button class="mode-pill" data-modo="1V1 DUELO">1V1 DUELO</button>
                        </div>
                        <div class="mode-sub" id="lobby-submodo">Mapa aleatorio • Listo</div>
                    </div>
                    <button id="btn-iniciar-juego">INICIAR</button>
                </div>

                <div class="bottom-tabs">
                    <button class="tab-btn" data-menu="INVENTARIO">🎒 INVENTARIO</button>
                    <button class="tab-btn" data-menu="ARMAS">🔫 ARMAS</button>
                    <button class="tab-btn" data-menu="PRESET">⚙️ PRESET</button>
                </div>
            </div>
        </div>

        <div id="menu-modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">MENÚ</div>
                <div class="modal-top-info">
                    <div class="currency-pill">🪙 <span id="modal-oro">9,947</span></div>
                    <div class="currency-pill dia">💎 <span id="modal-diamantes">85</span></div>
                    <button class="btn-cerrar-modal" id="btn-cerrar-modal">✕</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-cats" id="modal-cats"></div>
                <div>
                    <div class="modal-content-grid" id="modal-grid"></div>
                    <div class="modal-status-msg" id="modal-status"></div>
                </div>
            </div>
        </div>

        <div id="gameplay-ui">
            <div id="crosshair"></div>

            <div id="hud-top">
                <div class="player-card">
                    👤 <span id="hud-nombre">Jugador_1</span><br>
                    <span id="hud-municion" style="font-size:11px; color:#f8fafc;">Balas: 30/30 | Gloo: 3</span>
                </div>
                <div class="player-card" id="hud-vivos">vivo: 12 / 50</div>
            </div>

            <div id="hud-hp">
                HP 200 / 200
                <div class="hp-track"><div class="hp-bar"></div></div>
            </div>

            <div class="controls-layer">
                <div id="aim-zone"></div>
                <div id="joystick-base"><div id="joystick-stick"></div></div>

                <div class="touch-btn" id="btn-recargar">🔄</div>
                <div class="touch-btn" id="btn-gloo">🧊</div>
                <div class="touch-btn" id="btn-agachar">⬇️</div>
                <div class="touch-btn" id="btn-salto">🦘</div>
                <div class="touch-btn" id="btn-mira">🔍</div>
                <div class="touch-btn" id="btn-disparo">🎯</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const container = document.getElementById('game-container');
            const lobbyScreen = document.getElementById('lobby-screen');
            const gameplayUi = document.getElementById('gameplay-ui');
            const crosshair = document.getElementById('crosshair');
            const statusPill = document.getElementById('status-pill');

            function setEstado(texto, visible = true) {
                statusPill.textContent = texto;
                statusPill.style.display = visible ? 'block' : 'none';
            }

            let enLobby = true;
            let menuAbierto = false;
            let nombreJugador = 'Jugador_1';
            let modoActual = 'BR-CLASIFICATORIA';
            let oro = 9947;
            let diamantes = 85;
            let armaEquipada = 'Rifle AR Zeta';
            let presetActivo = 'Táctico 3 Dedos';
            let balas = 30;
            const maxBalas = 30;
            let glooRestantes = 3;

            const lobbyOroEl = document.getElementById('lobby-oro');
            const lobbyDiaEl = document.getElementById('lobby-diamantes');
            const modalOroEl = document.getElementById('modal-oro');
            const modalDiaEl = document.getElementById('modal-diamantes');

            function refrescarMonedas() {
                const oroFmt = oro.toLocaleString('en-US');
                lobbyOroEl.textContent = oroFmt;
                modalOroEl.textContent = oroFmt;
                lobbyDiaEl.textContent = diamantes;
                modalDiaEl.textContent = diamantes;
            }

            function actualizarHUD() {
                document.getElementById('hud-municion').textContent = `Balas: ${balas}/${maxBalas} | Gloo: ${glooRestantes}`;
            }

            const datosMenus = {
                TIENDA: {
                    titulo: '🛒 TIENDA ZETA',
                    cats: ['DESTACADOS', 'ARMAS', 'ROPA', 'CARGAR'],
                    items: {
                        DESTACADOS: [
                            { icon: '🔫', name: 'Rifle AR Zeta', desc: 'Cadencia estable • Precisión alta', btn: 'EQUIPAR', action: () => { armaEquipada = 'Rifle AR Zeta'; return 'Equipaste: Rifle AR Zeta'; } },
                            { icon: '🧊', name: 'Muro Gloo +2', desc: 'Refuerzo táctico para partida', btn: '200 🪙', action: () => { if (oro < 200) return 'Oro insuficiente'; oro -= 200; glooRestantes += 2; actualizarHUD(); refrescarMonedas(); return 'Compraste +2 Muros Gloo'; } },
                            { icon: '🦊', name: 'Mascota Zorro', desc: 'Acompañante del lobby', btn: 'ACTIVA', action: () => 'Mascota activa en el lobby' }
                        ],
                        ARMAS: [
                            { icon: '🔫', name: 'Rifle AR Zeta', desc: 'Daño medio • 30 balas', btn: 'EQUIPAR', action: () => { armaEquipada = 'Rifle AR Zeta'; return 'Equipaste: Rifle AR Zeta'; } },
                            { icon: '⚡', name: 'Carabina Rápida', desc: 'Disparo ágil a media distancia', btn: '350 🪙', action: () => { if (oro < 350) return 'Oro insuficiente'; oro -= 350; armaEquipada = 'Carabina Rápida'; refrescarMonedas(); return 'Compraste y equipaste Carabina Rápida'; } }
                        ],
                        ROPA: [
                            { icon: '🧥', name: 'Chaleco Táctico', desc: 'Estilo de combate Zeta', btn: 'PUESTO', action: () => 'Chaleco Táctico equipado' },
                            { icon: '🎒', name: 'Mochila Naranja', desc: 'Capacidad de suministro', btn: 'PUESTA', action: () => 'Mochila Naranja equipada' }
                        ],
                        CARGAR: [
                            { icon: '💎', name: 'Paquete +50 Diamantes', desc: 'Recarga rápida de prueba', btn: 'GRATIS', action: () => { diamantes += 50; refrescarMonedas(); return 'Sumaste +50 Diamantes'; } }
                        ]
                    }
                },

            function renderizarCategoria(menuKey, catName) {
                modalStatus.textContent = '';
                modalCats.querySelectorAll('.cat-item').forEach((el) => {
                    el.classList.toggle('activa', el.dataset.cat === catName);
                });
                modalGrid.innerHTML = '';
                const lista = datosMenus[menuKey].items[catName] || [];
                lista.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-badge">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        <button class="item-action">${item.btn}</button>
                    `;
                    card.querySelector('.item-action').addEventListener('click', (e) => {
                        e.stopPropagation();
                        modalStatus.textContent = item.action();
                    });
                    modalGrid.appendChild(card);
                });
            }

            function abrirMenu(menuKey) {
                const cfg = datosMenus[menuKey];

                refrescarMonedas();
                modalTitle.textContent = cfg.titulo;
                modalCats.innerHTML = '';
                cfg.cats.forEach((cat, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-item' + (idx === 0 ? ' activa' : '');
                    btn.dataset.cat = cat;
                    btn.textContent = cat;
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        renderizarCategoria(menuKey, cat);

                    modalCats.appendChild(btn);
                });
                renderizarCategoria(menuKey, cfg.cats[0]);
                menuModal.classList.add('abierto');
                menuAbierto = true;

            const canvas2D = document.createElement('canvas');
            const ctx2D = canvas2D.getContext('2d');

            let usarRespaldo2D = true;

            function ajustarCanvas2D() {
                canvas2D.width = container.clientWidth || window.innerWidth;
                canvas2D.height = container.clientHeight || window.innerHeight;
            }
            ajustarCanvas2D();
            window.addEventListener('resize', ajustarCanvas2D);

            function dibujarRespaldo2D(ahora = 0) {
                if (!usarRespaldo2D) return;
                const w = canvas2D.width;
                const h = canvas2D.height;
                const grad = ctx2D.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#1e40af');
                grad.addColorStop(0.55, '#38bdf8');
                grad.addColorStop(0.56, '#2f6f22');
                grad.addColorStop(1, '#1b4314');
                ctx2D.fillStyle = grad;
                ctx2D.fillRect(0, 0, w, h);

                const cx = w * 0.5;
                const cy = h * 0.62;
                const flotar = Math.sin(ahora * 0.004) * 5;

                ctx2D.fillStyle = 'rgba(124, 58, 237, 0.55)';
                ctx2D.beginPath();
                ctx2D.moveTo(cx + 30, cy - 170);
                ctx2D.lineTo(cx + 85, cy - 30);
                ctx2D.lineTo(cx - 25, cy - 30);
                ctx2D.closePath();
                ctx2D.fill();

                ctx2D.fillStyle = '#1f2937';
                ctx2D.fillRect(cx - 22, cy - 25, 16, 48);
                ctx2D.fillRect(cx + 6, cy - 25, 16, 48);

                ctx2D.fillStyle = '#1d4ed8';
                ctx2D.beginPath();
                ctx2D.roundRect(cx - 28, cy - 88 + flotar, 56, 66, 16);
                ctx2D.fill();

                ctx2D.fillStyle = '#ea580c';
                ctx2D.beginPath();
                ctx2D.roundRect(cx - 20, cy - 80 + flotar, 40, 44, 10);
                ctx2D.fill();

                ctx2D.fillStyle = '#e6b287';
                ctx2D.beginPath();
                ctx2D.arc(cx, cy - 114 + flotar, 24, 0, Math.PI * 2);
                ctx2D.fill();

                ctx2D.fillStyle = '#18181b';
                ctx2D.beginPath();
                ctx2D.arc(cx, cy - 120 + flotar, 25, Math.PI, Math.PI * 2);
                ctx2D.fill();

                ctx2D.fillStyle = '#f59e0b';
                ctx2D.beginPath();
                ctx2D.arc(cx + 58, cy + 8 + Math.abs(Math.sin(ahora * 0.005)) * -6, 15, 0, Math.PI * 2);
                ctx2D.fill();

                requestAnimationFrame(dibujarRespaldo2D);
            }
            requestAnimationFrame(dibujarRespaldo2D);

            function crearMiembroRedondeado(radio, alto, material, segs = 12) {
                const grupo = new THREE.Group();
                const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radio, radio, alto, segs), material);
                const sup = new THREE.Mesh(new THREE.SphereGeometry(radio, segs, 10), material);
                sup.position.y = alto / 2;
                const inf = new THREE.Mesh(new THREE.SphereGeometry(radio, segs, 10), material);
                inf.position.y = -alto / 2;
                grupo.add(cyl, sup, inf);
                return grupo;
            }

            function setCastShadow(obj, cast = true, receive = false) {
                obj.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = cast;
                        child.receiveShadow = receive;
                    }
                });
            }

            let api3D = null;

            function montarEscena3D() {
                usarRespaldo2D = false;
                if (canvas2D.parentNode) canvas2D.parentNode.removeChild(canvas2D);

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x4ea8de);
                scene.fog = new THREE.FogExp2(0x90e0ef, 0.0052);

                const w0 = container.clientWidth || window.innerWidth;
                const h0 = container.clientHeight || window.innerHeight;

                const camera = new THREE.PerspectiveCamera(60, w0 / h0, 0.1, 340);
                camera.position.set(0.25, 1.9, 6.2);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'default' });
                renderer.setSize(w0, h0, false);
                renderer.domElement.style.width = '100%';
                renderer.domElement.style.height = '100%';
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                window.addEventListener('resize', () => {
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || window.innerHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h, false);
                });

                const luzAmbiente = new THREE.HemisphereLight(0xe0f2fe, 0x245437, 1.18);
                scene.add(luzAmbiente);

                const luzSol = new THREE.DirectionalLight(0xfffbeb, 1.45);
                luzSol.position.set(35, 55, 28);
                luzSol.castShadow = true;
                scene.add(luzSol);

                function crearTexturaSuelo() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = '#346b1e';
                    ctx.fillRect(0, 0, 512, 512);

                    for (let i = 0; i < 120; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 512;
                        const rad = 16 + Math.random() * 36;
                        const grad = ctx.createRadialGradient(x, y, 2, x, y, rad);
                        if (i % 3 === 0) {
                            grad.addColorStop(0, 'rgba(120, 92, 56, 0.24)');
                            grad.addColorStop(1, 'rgba(120, 92, 56, 0)');
                        } else {
                            grad.addColorStop(0, 'rgba(84, 158, 44, 0.22)');
                            grad.addColorStop(1, 'rgba(84, 158, 44, 0)');
                        }
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(x, y, rad, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    for (let i = 0; i < 4500; i++) {
                        const x = Math.random() * 512;
                        const y = Math.random() * 512;
                        const len = 3 + Math.random() * 4;
                        ctx.strokeStyle = i % 2 === 0 ? 'rgba(42, 92, 22, 0.55)' : 'rgba(107, 178, 56, 0.45)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + (Math.random() - 0.5) * 2.5, y - len);
                        ctx.stroke();
                    }

                    const tex = new THREE.CanvasTexture(canvas);
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.repeat.set(24, 24);
                    return tex;
                }

                const suelo = new THREE.Mesh(
                    new THREE.PlaneGeometry(180, 180),
                    new THREE.MeshStandardMaterial({ map: crearTexturaSuelo(), roughness: 0.9 })
                );
                suelo.rotation.x = -Math.PI / 2;
                suelo.receiveShadow = true;
                scene.add(suelo);

                const portalGrupo = new THREE.Group();
                const portalCono = new THREE.Mesh(
                    new THREE.ConeGeometry(2.35, 4.5, 4),
                    new THREE.MeshStandardMaterial({
                        color: 0x7c3aed,
                        emissive: 0x5b21b6,
                        emissiveIntensity: 0.55,
                        transparent: true,
                        opacity: 0.62
                    })
                );
                portalCono.position.y = 2.25;
                const portalBase = new THREE.Mesh(
                    new THREE.CylinderGeometry(2.5, 2.75, 0.22, 20),
                    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.5 })
                );
                portalBase.position.y = 0.11;
                portalGrupo.add(portalCono, portalBase);
                portalGrupo.position.set(0.85, 0, -2.65);
                scene.add(portalGrupo);

                const mascotaGrupo = new THREE.Group();
                const mascotaCuerpo = crearMiembroRedondeado(0.21, 0.24, new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.62 }), 14);
                mascotaCuerpo.rotation.x = Math.PI / 2;
                mascotaCuerpo.position.set(0, 0.28, 0);

                const mascotaCabeza = new THREE.Mesh(
                    new THREE.SphereGeometry(0.22, 16, 14),
                    new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.58 })
                );
                mascotaCabeza.scale.set(1.05, 0.95, 1.12);
                mascotaCabeza.position.set(0, 0.49, 0.24);

                const orejaIzq = new THREE.Mesh(
                    new THREE.ConeGeometry(0.08, 0.18, 10),
                    new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.7 })
                );
                orejaIzq.position.set(-0.13, 0.68, 0.22);
                orejaIzq.rotation.z = 0.22;

                const orejaDer = orejaIzq.clone();
                orejaDer.position.x = 0.13;
                orejaDer.rotation.z = -0.22;

                const ojoMascotaIzq = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111827 }));
                ojoMascotaIzq.position.set(-0.08, 0.52, 0.43);
                const ojoMascotaDer = ojoMascotaIzq.clone();
                ojoMascotaDer.position.x = 0.08;

                const pataM1 = crearMiembroRedondeado(0.055, 0.08, new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.7 }), 10);
                pataM1.position.set(-0.13, 0.09, 0.16);
                const pataM2 = pataM1.clone();
                pataM2.position.x = 0.13;
                const pataM3 = pataM1.clone();
                pataM3.position.z = -0.15;
                const pataM4 = pataM1.clone();
                pataM4.position.set(0.13, 0.09, -0.15);

                mascotaGrupo.add(mascotaCuerpo, mascotaCabeza, orejaIzq, orejaDer, ojoMascotaIzq, ojoMascotaDer, pataM1, pataM2, pataM3, pataM4);
                setCastShadow(mascotaGrupo, true, false);

                scene.add(mascotaGrupo);

                const obstaculos = [];

                function crearArbolRealista(x, z, escala = 1) {
                    const grupo = new THREE.Group();

                    const tronco = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.28 * escala, 0.48 * escala, 3.0 * escala, 12),
                        new THREE.MeshStandardMaterial({ color: 0x54331b, roughness: 0.94 })
                    );
                    tronco.position.y = 1.5 * escala;

                    const copaBaja = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(2.1 * escala, 1),
                        new THREE.MeshStandardMaterial({ color: 0x1a5922, roughness: 0.82 })
                    );
                    copaBaja.position.set(0, 3.4 * escala, 0);
                    copaBaja.scale.set(1.15, 0.74, 1.12);

                    const copaMedia = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(1.65 * escala, 1),
                        new THREE.MeshStandardMaterial({ color: 0x26732d, roughness: 0.78 })
                    );
                    copaMedia.position.set(0.25 * escala, 4.25 * escala, -0.15 * escala);

                    const copaAlta = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(1.2 * escala, 1),
                        new THREE.MeshStandardMaterial({ color: 0x358f3b, roughness: 0.74 })
                    );
                    copaAlta.position.set(-0.2 * escala, 4.95 * escala, 0.15 * escala);

                    grupo.add(tronco, copaBaja, copaMedia, copaAlta);
                    setCastShadow(grupo, true, true);
                    grupo.position.set(x, 0, z);
                    scene.add(grupo);
                    obstaculos.push({ x, z, r: 0.85 * escala });
                }

                function crearCajaSuministro(x, z, rotY = 0) {
                    const grupo = new THREE.Group();
                    const base = new THREE.Mesh(
                        new THREE.BoxGeometry(2.4, 1.5, 2.4),
                        new THREE.MeshStandardMaterial({ color: 0x8f3d1d, roughness: 0.72, metalness: 0.08 })
                    );
                    base.position.y = 0.75;

                    const marcoSup = new THREE.Mesh(
                        new THREE.BoxGeometry(2.48, 0.16, 2.48),
                        new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.45, metalness: 0.25 })
                    );
                    marcoSup.position.y = 1.44;

                    const marcoInf = marcoSup.clone();
                    marcoInf.position.y = 0.1;

                    grupo.add(base, marcoSup, marcoInf);
                    setCastShadow(grupo, true, true);
                    grupo.position.set(x, 0, z);
                    grupo.rotation.y = rotY;
                    scene.add(grupo);
                    obstaculos.push({ x, z, r: 1.55 });
                }

                function crearRoca(x, z, escala = 1) {
                    const roca = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(1.35 * escala, 1),
                        new THREE.MeshStandardMaterial({ color: 0x5c6b7e, roughness: 0.9, metalness: 0.08 })
                    );
                    roca.position.set(x, 0.68 * escala, z);
                    roca.scale.set(1.28, 0.76, 1.08);
                    roca.castShadow = true;
                    roca.receiveShadow = true;
                    scene.add(roca);
                    obstaculos.push({ x, z, r: 1.2 * escala });
                }

                for (let i = 0; i < 30; i++) {
                    const ang = (i / 30) * Math.PI * 2;
                    const dist = 15 + (i % 3) * 14;
                    const esc = 0.85 + (i % 4) * 0.14;
                    crearArbolRealista(Math.cos(ang) * dist, Math.sin(ang) * dist, esc);
                }

                crearCajaSuministro(6, 6, 0.25);
                crearCajaSuministro(-8, 10, -0.4);
                crearCajaSuministro(10, -8, 0.7);
                crearCajaSuministro(-6, -6, 0.1);
                crearRoca(13, 4, 1.1);
                crearRoca(-12, -3, 1.35);
                crearRoca(3, -15, 0.95);

                const sombraJugador = new THREE.Mesh(
                    new THREE.CircleGeometry(0.75, 24),
                    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.36 })

                let velY = 0;

                const joystickBase = document.getElementById('joystick-base');
                const joystickStick = document.getElementById('joystick-stick');
                let joyActivo = false, joyTouchId = null, joyX = 0, joyY = 0;
                const maxRadio = 36;

                function actualizarJoystick(touch) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.hypot(dx, dy);
                    if (dist > maxRadio) {
                        dx = (dx / dist) * maxRadio;
                        dy = (dy / dist) * maxRadio;
                    }
                    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                    joyX = dx / maxRadio;
                    joyY = dy / maxRadio;
                }

                joystickBase.addEventListener('touchstart', (e) => {
                    if (enLobby || menuAbierto) return;
                    e.preventDefault();
                    e.stopPropagation();
                    joyActivo = true;
                    joyTouchId = e.changedTouches[0].identifier;
                    actualizarJoystick(e.changedTouches[0]);
                }, { passive: false });

                joystickBase.addEventListener('touchmove', (e) => {
                    if (enLobby || menuAbierto) return;
                    e.preventDefault();
                    e.stopPropagation();
                    if (!joyActivo) return;
                    for (const t of e.changedTouches) {
                        if (t.identifier === joyTouchId) actualizarJoystick(t);
                    }
                }, { passive: false });

                function soltarJoystick(e) {
                    for (const t of e.changedTouches) {
                        if (t.identifier === joyTouchId) {
                            joyActivo = false; joyTouchId = null; joyX = 0; joyY = 0;
                            joystickStick.style.transform = 'translate(0px, 0px)';

                const aimZone = document.getElementById('aim-zone');

                function aplicarRotacionMira(deltaX, deltaY, factorVertical = 1) {
                    camYaw -= deltaX * sensibilidad;

                    jugadorMesh.rotation.y = camYaw;

                    aimTouchId = t.identifier;
                    lastAimX = t.clientX;
                    lastAimY = t.clientY;
                }, { passive: false });

                aimZone.addEventListener('touchmove', (e) => {
                    if (enLobby || menuAbierto) return;
                    e.preventDefault();
                    if (aimTouchId === null) return;
                    for (const t of e.changedTouches) {
                        if (t.identifier === aimTouchId) {
                            const dx = t.clientX - lastAimX;
                            const dy = t.clientY - lastAimY;
                            lastAimX = t.clientX;
                            lastAimY = t.clientY;
                            aplicarRotacionMira(dx, dy, 1);
                        }
                    }
                }, { passive: false });

                function soltarMira(e) {
                    for (const t of e.changedTouches) {
                        if (t.identifier === aimTouchId) {
                            aimTouchId = null;

                const btnDisparo = document.getElementById('btn-disparo');

                function disparar() {

                    destelloDisparo.visible = true;

                    const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);

                        jugadorMesh.position.z + dir.z * 1.45

                    scene.add(balaMesh);

                            disparando = false;

                            btnDisparo.classList.remove('active');

                }
                btnDisparo.addEventListener('touchend', soltarDisparo);

                window.addEventListener('mouseup', () => { disparando = false; });

                const btnMira = document.getElementById('btn-mira');
                function toggleMira() {

                function ponerGloo() {
                    if (enLobby || menuAbierto || glooRestantes <= 0) return;
                    glooRestantes--;
                    actualizarHUD();

                    const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
                    const glooGrupo = new THREE.Group();

                    const panel = new THREE.Mesh(
                        new THREE.BoxGeometry(3.3, 2.25, 0.34),

                    glooGrupo.add(panel);
                    const gx = jugadorMesh.position.x + dir.x * 3.1;
                    const gz = jugadorMesh.position.z + dir.z * 3.1;
                    glooGrupo.position.set(gx, 0, gz);

                    scene.add(glooGrupo);
                    obstaculos.push({ x: gx, z: gz, r: 1.45 });

                function recargar() {
                    if (enLobby || menuAbierto) return;

                function saltar() {
                    if (enLobby || menuAbierto || !enSuelo) return;
                    if (agachado) agachado = false;
                    velY = 0.36;

                function toggleAgachar() {

                document.getElementById('btn-gloo').addEventListener('click', (e) => { e.stopPropagation(); ponerGloo(); });
                document.getElementById('btn-recargar').addEventListener('click', (e) => { e.stopPropagation(); recargar(); });
                document.getElementById('btn-salto').addEventListener('click', (e) => { e.stopPropagation(); saltar(); });
                document.getElementById('btn-agachar').addEventListener('click', (e) => { e.stopPropagation(); toggleAgachar(); });

                let ultimoFrame = performance.now();

                function animar(ahora = performance.now()) {
                    requestAnimationFrame(animar);
                    const dt = Math.min(50, ahora - ultimoFrame);
                    ultimoFrame = ahora;

                    if (tiempoDestello > 0) {
                        tiempoDestello -= dt;
                        if (tiempoDestello <= 0) destelloDisparo.visible = false;
                    }

                    if (enLobby) {
                        portalGrupo.visible = true;
                        mascotaGrupo.visible = true;
                        portalCono.rotation.y += dt * 0.0008;
                        mascotaGrupo.position.y = Math.abs(Math.sin(ahora * 0.004)) * 0.08;

                        jugadorMesh.rotation.y = 0.12;
                        pivotePiernaIzq.rotation.x = 0;
                        pivotePiernaDer.rotation.x = 0;
                        pivoteBrazoDer.rotation.x = -0.25;
                        pivoteBrazoIzq.rotation.x = -0.18;

                        camera.position.set(0.25, 1.9, 6.2);
                        camera.lookAt(0.2, 1.15, 0);

                        sombraJugador.position.set(jugadorMesh.position.x, 0.03, jugadorMesh.position.z);
                        renderer.render(scene, camera);
                        return;
                    }

                    portalGrupo.visible = false;
                    mascotaGrupo.visible = false;

                    if (disparando && ahora - ultimoDisparoTime >= intervaloDisparo) {
                        disparar();
                        ultimoDisparoTime = ahora;
                    }

                    const velocidad = agachado ? 0.14 : 0.22;
                    const forwardX = Math.sin(camYaw);
                    const forwardZ = Math.cos(camYaw);
                    const rightX = -Math.cos(camYaw);
                    const rightZ = Math.sin(camYaw);

                    const moveForward = -joyY;
                    const moveRight = joyX;
                    const intensidadMov = Math.min(1, Math.hypot(moveForward, moveRight));

                    const moveVecX = forwardX * moveForward + rightX * moveRight;
                    const moveVecZ = forwardZ * moveForward + rightZ * moveRight;

                    const nextX = jugadorMesh.position.x + moveVecX * velocidad;
                    const nextZ = jugadorMesh.position.z + moveVecZ * velocidad;

                    let bloqueado = false;
                    for (const obs of obstaculos) {
                        if (Math.hypot(nextX - obs.x, nextZ - obs.z) < obs.r + 0.52) {
                            bloqueado = true;
                            break;
                        }
                    }

                    if (!bloqueado) {
                        jugadorMesh.position.x = Math.max(-72, Math.min(72, nextX));
                        jugadorMesh.position.z = Math.max(-72, Math.min(72, nextZ));
                    }

                    jugadorMesh.rotation.y = camYaw;

                    const targetTorsoY = agachado ? 0.52 : 0.86;
                    torsoGrupo.position.y += (targetTorsoY - torsoGrupo.position.y) * 0.2;
                    torsoGrupo.rotation.x += ((agachado ? 0.24 : 0) - torsoGrupo.rotation.x) * 0.2;

                    if (intensidadMov > 0.05 && enSuelo) {
                        cicloPaso += dt * 0.015 * intensidadMov;
                        const angPierna = Math.sin(cicloPaso) * 0.62 * intensidadMov;
                        pivotePiernaIzq.rotation.x = angPierna;
                        pivotePiernaDer.rotation.x = -angPierna;
                        pivoteBrazoIzq.rotation.x = apuntando ? -1.1 : -angPierna * 0.55;
                        pivoteBrazoDer.rotation.x = apuntando ? -1.15 : angPierna * 0.4;
                    } else {
                        pivotePiernaIzq.rotation.x *= 0.8;
                        pivotePiernaDer.rotation.x *= 0.8;
                        const targetBrazoDer = apuntando ? -1.15 : -0.82;
                        const targetBrazoIzq = apuntando ? -1.1 : -0.75;
                        pivoteBrazoDer.rotation.x += (targetBrazoDer - pivoteBrazoDer.rotation.x) * 0.2;
                        pivoteBrazoIzq.rotation.x += (targetBrazoIzq - pivoteBrazoIzq.rotation.x) * 0.2;
                    }

                    if (!enSuelo) {
                        jugadorMesh.position.y += velY;
                        velY -= 0.015;
                        if (jugadorMesh.position.y <= 0) {
                            jugadorMesh.position.y = 0;
                            velY = 0;
                            enSuelo = true;
                        }
                    }

                    sombraJugador.position.x = jugadorMesh.position.x;
                    sombraJugador.position.z = jugadorMesh.position.z;
                    const escalaSombra = Math.max(0.35, 1 - jugadorMesh.position.y * 0.14);
                    sombraJugador.scale.set(escalaSombra, escalaSombra, 1);

                    for (let i = proyectiles.length - 1; i >= 0; i--) {
                        const p = proyectiles[i];
                        p.mesh.position.x += p.vx;
                        p.mesh.position.z += p.vz;
                        p.vida--;
                        if (p.vida <= 0) {
                            scene.remove(p.mesh);
                            proyectiles.splice(i, 1);
                        }
                    }

                    const targetFov = apuntando ? 42 : 60;
                    if (Math.abs(camera.fov - targetFov) > 0.2) {
                        camera.fov += (targetFov - camera.fov) * 0.18;
                        camera.updateProjectionMatrix();
                    }

                    const baseDist = apuntando ? 6.8 : 8.4;
                    const alturaCam = (apuntando ? 3.15 : 2.15) + Math.sin(camPitch) * baseDist;
                    let horizDist = Math.cos(camPitch) * baseDist;

                    const dirAtrasX = -Math.sin(camYaw);
                    const dirAtrasZ = -Math.cos(camYaw);
                    const hombroOffset = apuntando ? 1.55 : 0;

                    for (const obs of obstaculos) {
                        const cx = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                        const cz = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;
                        const distObs = Math.hypot(cx - obs.x, cz - obs.z);
                        if (distObs < obs.r + 0.9) {
                            horizDist = Math.max(2.8, horizDist - (obs.r + 0.9 - distObs));
                        }
                    }

                    const camTargetX = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                    const camTargetY = jugadorMesh.position.y + alturaCam;
                    const camTargetZ = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;

                    camera.position.lerp(new THREE.Vector3(camTargetX, camTargetY, camTargetZ), 0.18);
                    camera.lookAt(
                        jugadorMesh.position.x + Math.sin(camYaw) * 6 + rightX * (apuntando ? 0.5 : 0),
                        jugadorMesh.position.y + (apuntando ? 1.9 : 1.5) + Math.sin(camPitch) * 3,
                        jugadorMesh.position.z + Math.cos(camYaw) * 6 + rightZ * (apuntando ? 0.5 : 0)
                    );

                    renderer.render(scene, camera);
                }

                animar();
                api3D = { listo: true };
            }

            function cargarMotor3D() {
                if (window.THREE) {
                    setEstado('', false);
                    montarEscena3D();
                    return;
                }

                const urls = [
                    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
                    'https://unpkg.com/three@0.160.0/build/three.min.js'
                ];

                setEstado('ZETA LIVE • CARGANDO 3D...');

                function intentar(idx) {
                    if (window.THREE) {
                        setEstado('', false);
                        montarEscena3D();
                        return;
                    }
                    if (idx >= urls.length) {
                        setEstado('ZETA LIVE • LISTO', true);
                        setTimeout(() => setEstado('', false), 1500);
                        return;
                    }
                    const s = document.createElement('script');
                    s.src = urls[idx];
                    const t = setTimeout(() => {
                        if (!window.THREE) intentar(idx + 1);
                    }, 2500);
                    s.onload = () => {
                        clearTimeout(t);
                        if (window.THREE && !api3D) {
                            setEstado('', false);
                            montarEscena3D();
                        }
                    };
                    s.onerror = () => {
                        clearTimeout(t);
                        intentar(idx + 1);
                    };
                    document.head.appendChild(s);
                }

                intentar(0);
            }

            cargarMotor3D();
        })();
    </script>
</body>
</html>
