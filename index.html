<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1320;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ==========================================
           PANTALLA PRINCIPAL (LOBBY ESTILO FREE FIRE)
           ========================================== */
        #lobby-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 20px;
            background: radial-gradient(circle at 75% 45%, rgba(15, 23, 42, 0.08) 0%, rgba(2, 6, 23, 0.65) 100%);
            pointer-events: auto;
        }
        #lobby-screen.oculto {
            display: none;
            pointer-events: none;
        }
        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.72));
            border: 1px solid rgba(250, 204, 21, 0.75);
            border-radius: 12px;
            padding: 8px 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }
        .brand-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #facc15;
            text-shadow: 0 2px 8px rgba(250, 204, 21, 0.35);
        }
        .brand-sub {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }
        .lobby-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(15, 23, 42, 0.84);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            padding: 6px 12px;
            color: #f8fafc;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .stat-pill.oro {
            border-color: rgba(250, 204, 21, 0.6);
            color: #fde047;
        }
        .stat-pill.diamantes {
            border-color: rgba(56, 189, 248, 0.65);
            color: #7dd3fc;
        }
        .lobby-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }
        .lobby-tip {
            background: rgba(15, 23, 42, 0.72);
            border-left: 3px solid #facc15;
            border-radius: 8px;
            padding: 8px 12px;
            color: #e2e8f0;
            font-size: 12px;
            max-width: 280px;
        }
        .launch-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            margin-left: auto;
        }
        .mode-selector {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.82);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .mode-btn {
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 7px;
            cursor: pointer;
        }
        .mode-btn.activo {
            background: linear-gradient(135deg, #f59e0b, #eab308);
            color: #0f172a;
        }
        #btn-iniciar-juego {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            border: 2px solid #fef08a;
            border-radius: 12px;
            padding: 13px 34px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.45);
        }
        #btn-iniciar-juego:active {
            transform: scale(0.96);
        }

        /* ==========================================
           INTERFAZ EN PARTIDA (HUD Y CONTROLES)
           ========================================== */
        #gameplay-ui {
            display: none;
        }
        #gameplay-ui.activo {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.75);
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }
        #crosshair::before {
            width: 2px;
            height: 8px;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 36px 0 rgba(255, 255, 255, 0.9);
        }
        #crosshair::after {
            width: 5px;
            height: 5px;
            background: #ff3b30;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.82), rgba(2, 6, 23, 0.72));
            border: 1px solid rgba(250, 204, 21, 0.65);
            border-radius: 10px;
            padding: 7px 13px;
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        #hud-hp {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
        }
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 56%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(15, 23, 42, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(250, 204, 21, 0.38);
            border-color: #facc15;
        }
        #btn-disparo {
            bottom: 34px;
            right: 24px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.85), rgba(185, 28, 28, 0.75));
            border-color: #ff6b6b;
            width: 78px;
            height: 78px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 52px;
            right: 116px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.38);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 124px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 118px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-color: #facc15;
            background: rgba(202, 138, 4, 0.4);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 176px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.4);
        }
        #btn-recargar {
            bottom: 174px;
            right: 112px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        #joystick-base {
            position: absolute;
            bottom: 42px;
            left: 34px;
            width: 114px;
            height: 114px;
            background: rgba(15, 23, 42, 0.32);
            border: 2px solid rgba(255, 255, 255, 0.42);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #fef08a, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- PANTALLA PRINCIPAL (LOBBY) -->
        <div id="lobby-screen">
            <div class="lobby-top">
                <div class="brand-box">
                    <div class="brand-title">ZETA BATTLE</div>
                    <div class="brand-sub" id="lobby-modo-label">Modo: Battle Royale</div>
                </div>

                <div class="lobby-stats">
                    <div class="stat-pill" id="lobby-player-btn" title="Cambiar nombre">
                        👤 <span id="lobby-nombre">Jugador_1</span> ✏️
                    </div>
                    <div class="stat-pill oro">🪙 <span id="lobby-oro">1,250</span></div>
                    <div class="stat-pill diamantes">💎 <span id="lobby-diamantes">85</span></div>
                </div>
            </div>

            <div class="lobby-bottom">
                <div class="lobby-tip">
                    Pulsa <b>INICIAR</b> para entrar. Camina con el joystick izquierdo y gira/apunta con el lado derecho.
                </div>

                <div class="launch-panel">
                    <div class="mode-selector">
                        <button class="mode-btn activo" data-modo="Battle Royale">Battle Royale</button>
                        <button class="mode-btn" data-modo="1v1 Duelo">1v1 Duelo</button>
                    </div>
                    <button id="btn-iniciar-juego">INICIAR</button>
                </div>
            </div>
        </div>

        <!-- INTERFAZ EN PARTIDA -->
        <div id="gameplay-ui">
            <div id="crosshair"></div>

            <div id="hud-top">
                <div class="player-card">
                    👤 <span id="hud-nombre">Jugador_1</span><br>
                    <span id="hud-municion" style="font-size:11px; color:#f8fafc;">Balas: 30/30 | Gloo: 3</span>
                </div>
                <div class="player-card" id="hud-vivos">vivo: 12 / 50</div>
            </div>

            <div id="hud-hp">
                HP 200 / 200
                <div class="hp-track"><div class="hp-bar"></div></div>
            </div>

            <div class="controls-layer">
                <div id="aim-zone"></div>
                <div id="joystick-base"><div id="joystick-stick"></div></div>

                <div class="touch-btn" id="btn-recargar">🔄</div>
                <div class="touch-btn" id="btn-gloo">🧊</div>
                <div class="touch-btn" id="btn-agachar">⬇️</div>
                <div class="touch-btn" id="btn-salto">🦘</div>
                <div class="touch-btn" id="btn-mira">🔍</div>
                <div class="touch-btn" id="btn-disparo">🎯</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
        const container = document.getElementById('game-container');
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameplayUi = document.getElementById('gameplay-ui');
        const crosshair = document.getElementById('crosshair');

        let enLobby = true;
        let nombreJugador = 'Jugador_1';
        let modoActual = 'Battle Royale';

        // Controles del lobby
        const lobbyNombreEl = document.getElementById('lobby-nombre');
        const hudNombreEl = document.getElementById('hud-nombre');
        const hudVivosEl = document.getElementById('hud-vivos');
        const lobbyModoLabel = document.getElementById('lobby-modo-label');

        document.getElementById('lobby-player-btn').addEventListener('click', () => {
            const nuevo = prompt('Escribe tu nombre de jugador:', nombreJugador);
            if (nuevo && nuevo.trim()) {
                nombreJugador = nuevo.trim().slice(0, 16);
                lobbyNombreEl.textContent = nombreJugador;
                hudNombreEl.textContent = nombreJugador;
            }
        });

        document.querySelectorAll('.mode-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach((b) => b.classList.remove('activo'));
                btn.classList.add('activo');
                modoActual = btn.dataset.modo;
                lobbyModoLabel.textContent = `Modo: ${modoActual}`;
                hudVivosEl.textContent = modoActual === '1v1 Duelo' ? 'vivo: 2 / 2' : 'vivo: 12 / 50';
            });
        });

        document.getElementById('btn-iniciar-juego').addEventListener('click', () => {
            enLobby = false;
            lobbyScreen.classList.add('oculto');
            gameplayUi.classList.add('activo');
        });

        // Escena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4ea8de);
        scene.fog = new THREE.FogExp2(0x90e0ef, 0.0065);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 320);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const luzAmbiente = new THREE.HemisphereLight(0xdbeafe, 0x2d6a4f, 1.0);
        scene.add(luzAmbiente);

        const luzSol = new THREE.DirectionalLight(0xfff3b0, 1.35);
        luzSol.position.set(35, 55, 25);
        luzSol.castShadow = true;
        luzSol.shadow.mapSize.width = 1024;
        luzSol.shadow.mapSize.height = 1024;
        luzSol.shadow.camera.near = 5;
        luzSol.shadow.camera.far = 160;
        const d = 55;
        luzSol.shadow.camera.left = -d;
        luzSol.shadow.camera.right = d;
        luzSol.shadow.camera.top = d;
        luzSol.shadow.camera.bottom = -d;
        scene.add(luzSol);

        function crearTexturaSuelo() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#38761d';
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 4500; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = 1 + Math.random() * 3.5;
                const tonos = ['#2f6617', '#468c26', '#539e2f', '#3d5a27'];
                ctx.fillStyle = tonos[Math.floor(Math.random() * tonos.length)];
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(22, 22);
            return tex;
        }

        const suelo = new THREE.Mesh(
            new THREE.PlaneGeometry(160, 160),
            new THREE.MeshStandardMaterial({
                map: crearTexturaSuelo(),
                roughness: 0.88,
                metalness: 0.04
            })
        );
        suelo.rotation.x = -Math.PI / 2;
        suelo.receiveShadow = true;
        scene.add(suelo);

        const obstaculos = [];

        function crearArbolRealista(x, z, escala = 1) {
            const grupo = new THREE.Group();

            const tronco = new THREE.Mesh(
                new THREE.CylinderGeometry(0.28 * escala, 0.46 * escala, 2.8 * escala, 10),
                new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.95 })
            );
            tronco.position.y = 1.4 * escala;
            tronco.castShadow = true;
            tronco.receiveShadow = true;

            const matFollaje1 = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.8 });
            const matFollaje2 = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.78 });
            const matFollaje3 = new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.75 });

            const copaBaja = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1 * escala, 1), matFollaje1);
            copaBaja.position.set(0, 3.3 * escala, 0);
            copaBaja.scale.set(1.1, 0.75, 1.1);
            copaBaja.castShadow = true;

            const copaMedia = new THREE.Mesh(new THREE.DodecahedronGeometry(1.75 * escala, 1), matFollaje2);
            copaMedia.position.set(0.55 * escala, 4.3 * escala, -0.35 * escala);
            copaMedia.scale.set(1.05, 0.8, 1.05);
            copaMedia.castShadow = true;

            const copaAlta = new THREE.Mesh(new THREE.DodecahedronGeometry(1.35 * escala, 1), matFollaje3);
            copaAlta.position.set(-0.4 * escala, 5.1 * escala, 0.35 * escala);
            copaAlta.castShadow = true;

            grupo.add(tronco, copaBaja, copaMedia, copaAlta);
            grupo.position.set(x, 0, z);
            scene.add(grupo);
            obstaculos.push({ x, z, r: 0.85 * escala });
        }

        function crearCajaSuministro(x, z, rotY = 0) {
            const grupo = new THREE.Group();

            const base = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 1.5, 2.4),
                new THREE.MeshStandardMaterial({ color: 0x9c4221, roughness: 0.7 })
            );
            base.position.y = 0.75;
            base.castShadow = true;
            base.receiveShadow = true;

            const marco = new THREE.Mesh(
                new THREE.BoxGeometry(2.5, 0.2, 2.5),
                new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 })
            );
            marco.position.y = 1.42;
            marco.castShadow = true;

            const franja = new THREE.Mesh(
                new THREE.BoxGeometry(2.46, 0.35, 2.46),
                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 })
            );
            franja.position.y = 0.75;

            grupo.add(base, marco, franja);
            grupo.position.set(x, 0, z);
            grupo.rotation.y = rotY;
            scene.add(grupo);
            obstaculos.push({ x, z, r: 1.55 });
        }

        function crearRoca(x, z, escala = 1) {
            const roca = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1.3 * escala, 1),
                new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.92 })
            );
            roca.position.set(x, 0.65 * escala, z);
            roca.scale.set(1.25, 0.75, 1.05);
            roca.castShadow = true;
            roca.receiveShadow = true;
            scene.add(roca);
            obstaculos.push({ x, z, r: 1.2 * escala });
        }

        for (let i = 0; i < 28; i++) {
            const ang = (i / 28) * Math.PI * 2;
            const dist = 15 + (i % 3) * 14;
            const esc = 0.85 + (i % 4) * 0.14;
            crearArbolRealista(Math.cos(ang) * dist, Math.sin(ang) * dist, esc);
        }

        crearCajaSuministro(6, 6, 0.25);
        crearCajaSuministro(-8, 10, -0.4);
        crearCajaSuministro(10, -8, 0.7);
        crearCajaSuministro(-6, -6, 0.1);
        crearRoca(13, 4, 1.1);
        crearRoca(-12, -3, 1.35);
        crearRoca(3, -15, 0.95);

        const sombraJugador = new THREE.Mesh(
            new THREE.CircleGeometry(0.75, 24),
            new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.36 })
        );
        sombraJugador.rotation.x = -Math.PI / 2;
        sombraJugador.position.y = 0.03;
        scene.add(sombraJugador);

        // Personaje 3D articulado
        const jugadorMesh = new THREE.Group();

        const matPiel = new THREE.MeshStandardMaterial({ color: 0xe8b48a, roughness: 0.62 });
        const matCabello = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.75 });
        const matCamisa = new THREE.MeshStandardMaterial({ color: 0x1e40af, roughness: 0.52 });
        const matChaleco = new THREE.MeshStandardMaterial({ color: 0x27303f, roughness: 0.65 });
        const matPantalon = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.75 });
        const matBota = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.55 });
        const matMochila = new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.48 });

        const pivotePiernaIzq = new THREE.Group();
        pivotePiernaIzq.position.set(-0.18, 0.84, 0);
        const musloIzq = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.32, 6, 10), matPantalon);
        musloIzq.position.y = -0.22;
        musloIzq.castShadow = true;
        const botaIzq = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.24, 0.34), matBota);
        botaIzq.position.set(0, -0.72, 0.04);
        botaIzq.castShadow = true;
        pivotePiernaIzq.add(musloIzq, botaIzq);

        const pivotePiernaDer = new THREE.Group();
        pivotePiernaDer.position.set(0.18, 0.84, 0);
        const musloDer = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.32, 6, 10), matPantalon);
        musloDer.position.y = -0.22;
        musloDer.castShadow = true;
        const botaDer = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.24, 0.34), matBota);
        botaDer.position.set(0, -0.72, 0.04);
        botaDer.castShadow = true;
        pivotePiernaDer.add(musloDer, botaDer);

        const torsoGrupo = new THREE.Group();
        torsoGrupo.position.set(0, 0.86, 0);

        const pecho = new THREE.Mesh(new THREE.CapsuleGeometry(0.27, 0.42, 8, 12), matCamisa);
        pecho.rotation.z = Math.PI / 2;
        pecho.scale.set(0.75, 1.15, 0.95);
        pecho.position.y = 0.42;
        pecho.castShadow = true;

        const chalecoTactico = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.46, 0.44), matChaleco);
        chalecoTactico.position.set(0, 0.46, 0.02);
        chalecoTactico.castShadow = true;

        const cuello = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.14, 10), matPiel);
        cuello.position.set(0, 0.78, 0.02);

        const cabezaGrupo = new THREE.Group();
        cabezaGrupo.position.set(0, 1.04, 0.03);

        const craneo = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), matPiel);
        craneo.scale.set(0.92, 1.06, 0.98);
        craneo.castShadow = true;

        const cabelloVolumen = new THREE.Mesh(new THREE.SphereGeometry(0.295, 16, 14), matCabello);
        cabelloVolumen.scale.set(0.95, 0.95, 1.02);
        cabelloVolumen.position.set(0, 0.06, -0.02);
        cabelloVolumen.castShadow = true;

        const flequillo = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.11, 0.16), matCabello);
        flequillo.position.set(0, 0.14, 0.22);

        const ojoIzq = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.03), new THREE.MeshBasicMaterial({ color: 0x111827 }));
        ojoIzq.position.set(-0.09, 0.01, 0.265);
        const ojoDer = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.03), new THREE.MeshBasicMaterial({ color: 0x111827 }));
        ojoDer.position.set(0.09, 0.01, 0.265);

        cabezaGrupo.add(craneo, cabelloVolumen, flequillo, ojoIzq, ojoDer);

        const mochilaGrupo = new THREE.Group();
        mochilaGrupo.position.set(0, 0.44, -0.28);
        const bolsaPrincipal = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.56, 0.22), matMochila);
        bolsaPrincipal.castShadow = true;
        const bolsillo = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.26, 0.08), new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.55 }));
        bolsillo.position.set(0, -0.08, -0.13);
        mochilaGrupo.add(bolsaPrincipal, bolsillo);

        const pivoteBrazoIzq = new THREE.Group();
        pivoteBrazoIzq.position.set(-0.42, 0.64, 0.02);
        const brazoIzqMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.36, 6, 8), matPiel);
        brazoIzqMesh.position.y = -0.24;
        brazoIzqMesh.castShadow = true;
        pivoteBrazoIzq.add(brazoIzqMesh);

        const pivoteBrazoDer = new THREE.Group();
        pivoteBrazoDer.position.set(0.42, 0.64, 0.02);
        const brazoDerMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.36, 6, 8), matPiel);
        brazoDerMesh.position.y = -0.24;
        brazoDerMesh.castShadow = true;

        const rifleGrupo = new THREE.Group();
        rifleGrupo.position.set(-0.04, -0.34, 0.38);

        const receptor = new THREE.Mesh(
            new THREE.BoxGeometry(0.09, 0.13, 0.72),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.55, roughness: 0.35 })
        );
        const culata = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.15, 0.26),
            new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.65 })
        );
        culata.position.set(0, -0.02, -0.44);

        const cargador = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.22, 0.12),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 })
        );
        cargador.rotation.x = 0.22;
        cargador.position.set(0, -0.14, 0.08);

        const canion = new THREE.Mesh(
            new THREE.CylinderGeometry(0.026, 0.026, 0.36, 8),
            new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.75, roughness: 0.25 })
        );
        canion.rotation.x = Math.PI / 2;
        canion.position.set(0, 0.02, 0.5);

        const miraRifle = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, 0.06, 0.12),
            new THREE.MeshStandardMaterial({ color: 0x09090b, metalness: 0.6, roughness: 0.3 })
        );
        miraRifle.position.set(0, 0.09, 0.05);

        const destelloDisparo = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.92 })
        );
        destelloDisparo.position.set(0, 0.02, 0.72);
        destelloDisparo.visible = false;

        rifleGrupo.add(receptor, culata, cargador, canion, miraRifle, destelloDisparo);
        pivoteBrazoDer.add(brazoDerMesh, rifleGrupo);

        torsoGrupo.add(pecho, chalecoTactico, cuello, cabezaGrupo, mochilaGrupo, pivoteBrazoIzq, pivoteBrazoDer);
        jugadorMesh.add(pivotePiernaIzq, pivotePiernaDer, torsoGrupo);
        scene.add(jugadorMesh);

        // Estado del jugador y cámara
        let velY = 0;
        let enSuelo = true;
        let agachado = false;
        let apuntando = false;
        let balas = 30;
        const maxBalas = 30;
        let glooRestantes = 3;
        let tiempoDestello = 0;
        let cicloPaso = 0;
        let anguloLobby = 0.45;
        const proyectiles = [];

        let camYaw = 0;
        let camPitch = 0.22;
        const sensibilidad = 0.0055;

        function actualizarHUD() {
            document.getElementById('hud-municion').textContent = `Balas: ${balas}/${maxBalas} | Gloo: ${glooRestantes}`;
        }

        // 1. Joystick izquierdo
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let joyActivo = false, joyTouchId = null, joyX = 0, joyY = 0;
        const maxRadio = 36;

        function actualizarJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            if (dist > maxRadio) {
                dx = (dx / dist) * maxRadio;
                dy = (dy / dist) * maxRadio;
            }
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadio;
            joyY = dy / maxRadio;
        }

        joystickBase.addEventListener('touchstart', (e) => {
            if (enLobby) return;
            e.preventDefault();
            e.stopPropagation();
            joyActivo = true;
            joyTouchId = e.changedTouches[0].identifier;
            actualizarJoystick(e.changedTouches[0]);
        }, { passive: false });

        joystickBase.addEventListener('touchmove', (e) => {
            if (enLobby) return;
            e.preventDefault();
            e.stopPropagation();
            if (!joyActivo) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) actualizarJoystick(t);
            }
        }, { passive: false });

        function soltarJoystick(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyActivo = false; joyTouchId = null; joyX = 0; joyY = 0;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        }
        joystickBase.addEventListener('touchend', soltarJoystick);
        joystickBase.addEventListener('touchcancel', soltarJoystick);

        // 2. Zona derecha de cámara / mira
        const aimZone = document.getElementById('aim-zone');
        let aimTouchId = null;
        let lastAimX = 0;
        let lastAimY = 0;

        function aplicarRotacionMira(deltaX, deltaY, factorVertical = 1) {
            camYaw -= deltaX * sensibilidad;
            camPitch = Math.max(-0.25, Math.min(0.75, camPitch + deltaY * sensibilidad * factorVertical));
            jugadorMesh.rotation.y = camYaw;
        }

        aimZone.addEventListener('touchstart', (e) => {
            if (enLobby) return;
            e.preventDefault();
            if (aimTouchId !== null) return;
            const t = e.changedTouches[0];
            aimTouchId = t.identifier;
            lastAimX = t.clientX;
            lastAimY = t.clientY;
        }, { passive: false });

        aimZone.addEventListener('touchmove', (e) => {
            if (enLobby) return;
            e.preventDefault();
            if (aimTouchId === null) return;
            for (const t of e.changedTouches) {
                if (t.identifier === aimTouchId) {
                    const dx = t.clientX - lastAimX;
                    const dy = t.clientY - lastAimY;
                    lastAimX = t.clientX;
                    lastAimY = t.clientY;
                    aplicarRotacionMira(dx, dy, 1);
                }
            }
        }, { passive: false });

        function soltarMira(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === aimTouchId) {
                    aimTouchId = null;
                }
            }
        }
        aimZone.addEventListener('touchend', soltarMira);
        aimZone.addEventListener('touchcancel', soltarMira);

        // 3. Disparo continuo + arrastre de mira
        const btnDisparo = document.getElementById('btn-disparo');
        let disparando = false;
        let fireTouchId = null;
        let lastFireX = 0;
        let lastFireY = 0;
        let ultimoDisparoTime = 0;
        const intervaloDisparo = 135;

        function disparar() {
            if (enLobby || balas <= 0) return;
            balas--;
            actualizarHUD();

            destelloDisparo.visible = true;
            tiempoDestello = 45;

            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
            const balaMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfef08a })
            );
            balaMesh.position.set(
                jugadorMesh.position.x + dir.x * 1.45,
                jugadorMesh.position.y + (agachado ? 0.85 : 1.32),
                jugadorMesh.position.z + dir.z * 1.45
            );
            scene.add(balaMesh);
            proyectiles.push({ mesh: balaMesh, vx: dir.x * 1.55, vz: dir.z * 1.55, vida: 48 });
        }

        btnDisparo.addEventListener('touchstart', (e) => {
            if (enLobby) return;
            e.preventDefault();
            e.stopPropagation();
            const t = e.changedTouches[0];
            fireTouchId = t.identifier;
            lastFireX = t.clientX;
            lastFireY = t.clientY;
            disparando = true;
            btnDisparo.classList.add('active');
            disparar();
            ultimoDisparoTime = performance.now();
        }, { passive: false });

        btnDisparo.addEventListener('touchmove', (e) => {
            if (enLobby) return;
            e.preventDefault();
            e.stopPropagation();
            if (!disparando) return;
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    const dx = t.clientX - lastFireX;
                    const dy = t.clientY - lastFireY;
                    lastFireX = t.clientX;
                    lastFireY = t.clientY;
                    aplicarRotacionMira(dx * 0.75, dy * 0.75, 1.15);
                }
            }
        }, { passive: false });

        function soltarDisparo(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    disparando = false;
                    fireTouchId = null;
                    btnDisparo.classList.remove('active');
                }
            }
        }
        btnDisparo.addEventListener('touchend', soltarDisparo);
        btnDisparo.addEventListener('touchcancel', soltarDisparo);
        btnDisparo.addEventListener('mousedown', () => {
            if (enLobby) return;
            disparando = true;
            disparar();
            ultimoDisparoTime = performance.now();
        });
        window.addEventListener('mouseup', () => { disparando = false; });

        // 4. Mira / Zoom
        const btnMira = document.getElementById('btn-mira');
        function toggleMira() {
            if (enLobby) return;
            apuntando = !apuntando;
            btnMira.classList.toggle('active', apuntando);
            crosshair.style.display = apuntando ? 'block' : 'none';
        }
        btnMira.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleMira();
        }, { passive: false });
        btnMira.addEventListener('click', toggleMira);

        // 5. Acciones
        function ponerGloo() {
            if (enLobby || glooRestantes <= 0) return;
            glooRestantes--;
            actualizarHUD();

            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
            const glooGrupo = new THREE.Group();

            const panel = new THREE.Mesh(
                new THREE.BoxGeometry(3.3, 2.25, 0.34),
                new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    emissive: 0x0284c7,
                    emissiveIntensity: 0.25,
                    transparent: true,
                    opacity: 0.68,
                    roughness: 0.15
                })
            );
            panel.position.y = 1.12;
            panel.castShadow = true;

            const borde = new THREE.Mesh(
                new THREE.BoxGeometry(3.36, 0.14, 0.4),
                new THREE.MeshStandardMaterial({
                    color: 0xbae6fd,
                    transparent: true,
                    opacity: 0.85
                })
            );
            borde.position.y = 2.18;

            glooGrupo.add(panel, borde);
            const gx = jugadorMesh.position.x + dir.x * 3.1;
            const gz = jugadorMesh.position.z + dir.z * 3.1;
            glooGrupo.position.set(gx, 0, gz);
            glooGrupo.rotation.y = jugadorMesh.rotation.y;
            scene.add(glooGrupo);
            obstaculos.push({ x: gx, z: gz, r: 1.45 });
        }

        function recargar() {
            if (enLobby) return;
            balas = maxBalas;
            actualizarHUD();
        }

        function saltar() {
            if (enLobby || !enSuelo) return;
            if (agachado) agachado = false;
            velY = 0.36;
            enSuelo = false;
        }

        function toggleAgachar() {
            if (enLobby) return;
            agachado = !agachado;
        }

        function vincularBoton(id, fn) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                fn();
            }, { passive: false });
            el.addEventListener('click', fn);
        }

        vincularBoton('btn-gloo', ponerGloo);
        vincularBoton('btn-recargar', recargar);
        vincularBoton('btn-salto', saltar);
        vincularBoton('btn-agachar', toggleAgachar);

        let ultimoFrame = performance.now();

        function animar(ahora = performance.now()) {
            requestAnimationFrame(animar);
            const dt = Math.min(50, ahora - ultimoFrame);
            ultimoFrame = ahora;

            if (tiempoDestello > 0) {
                tiempoDestello -= dt;
                if (tiempoDestello <= 0) destelloDisparo.visible = false;
            }

            if (enLobby) {
                // Vista panorámica suave en el lobby con el personaje de frente/perfil
                anguloLobby += dt * 0.00045;
                jugadorMesh.rotation.y = 0.25;
                pivotePiernaIzq.rotation.x *= 0.85;
                pivotePiernaDer.rotation.x *= 0.85;
                pivoteBrazoDer.rotation.x += (-0.55 - pivoteBrazoDer.rotation.x) * 0.15;
                pivoteBrazoIzq.rotation.x += (-0.45 - pivoteBrazoIzq.rotation.x) * 0.15;

                const radioLobby = 5.4;
                camera.position.lerp(
                    new THREE.Vector3(
                        jugadorMesh.position.x + Math.sin(anguloLobby) * radioLobby,
                        2.15,
                        jugadorMesh.position.z + Math.cos(anguloLobby) * radioLobby
                    ),
                    0.08
                );
                camera.lookAt(
                    jugadorMesh.position.x - 0.55,
                    1.35,
                    jugadorMesh.position.z
                );

                sombraJugador.position.set(jugadorMesh.position.x, 0.03, jugadorMesh.position.z);
                renderer.render(scene, camera);
                return;
            }

            if (disparando && ahora - ultimoDisparoTime >= intervaloDisparo) {
                disparar();
                ultimoDisparoTime = ahora;
            }

            const velocidad = agachado ? 0.14 : 0.22;
            const forwardX = Math.sin(camYaw);
            const forwardZ = Math.cos(camYaw);
            const rightX = -Math.cos(camYaw);
            const rightZ = Math.sin(camYaw);

            const moveForward = -joyY;
            const moveRight = joyX;
            const intensidadMov = Math.min(1, Math.hypot(moveForward, moveRight));

            const moveVecX = forwardX * moveForward + rightX * moveRight;
            const moveVecZ = forwardZ * moveForward + rightZ * moveRight;

            const nextX = jugadorMesh.position.x + moveVecX * velocidad;
            const nextZ = jugadorMesh.position.z + moveVecZ * velocidad;

            let bloqueado = false;
            for (const obs of obstaculos) {
                if (Math.hypot(nextX - obs.x, nextZ - obs.z) < obs.r + 0.52) {
                    bloqueado = true;
                    break;
                }
            }

            if (!bloqueado) {
                jugadorMesh.position.x = Math.max(-72, Math.min(72, nextX));
                jugadorMesh.position.z = Math.max(-72, Math.min(72, nextZ));
            }

            jugadorMesh.rotation.y = camYaw;

            const targetTorsoY = agachado ? 0.52 : 0.86;
            torsoGrupo.position.y += (targetTorsoY - torsoGrupo.position.y) * 0.2;
            torsoGrupo.rotation.x += ((agachado ? 0.24 : 0) - torsoGrupo.rotation.x) * 0.2;

            if (intensidadMov > 0.05 && enSuelo) {
                cicloPaso += dt * 0.015 * intensidadMov;
                const angPierna = Math.sin(cicloPaso) * 0.62 * intensidadMov;
                pivotePiernaIzq.rotation.x = angPierna;
                pivotePiernaDer.rotation.x = -angPierna;
                pivoteBrazoIzq.rotation.x = apuntando ? -1.35 : -angPierna * 0.55;
                pivoteBrazoDer.rotation.x = apuntando ? -1.42 : angPierna * 0.4;
            } else {
                pivotePiernaIzq.rotation.x *= 0.8;
                pivotePiernaDer.rotation.x *= 0.8;
                const targetBrazoDer = apuntando ? -1.42 : -0.25;
                const targetBrazoIzq = apuntando ? -1.35 : -0.1;
                pivoteBrazoDer.rotation.x += (targetBrazoDer - pivoteBrazoDer.rotation.x) * 0.2;
                pivoteBrazoIzq.rotation.x += (targetBrazoIzq - pivoteBrazoIzq.rotation.x) * 0.2;
            }

            if (!enSuelo) {
                jugadorMesh.position.y += velY;
                velY -= 0.015;
                if (jugadorMesh.position.y <= 0) {
                    jugadorMesh.position.y = 0;
                    velY = 0;
                    enSuelo = true;
                }
            }

            sombraJugador.position.x = jugadorMesh.position.x;
            sombraJugador.position.z = jugadorMesh.position.z;
            const escalaSombra = Math.max(0.35, 1 - jugadorMesh.position.y * 0.14);
            sombraJugador.scale.set(escalaSombra, escalaSombra, 1);

            for (let i = proyectiles.length - 1; i >= 0; i--) {
                const p = proyectiles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.z += p.vz;
                p.vida--;
                if (p.vida <= 0) {
                    scene.remove(p.mesh);
                    proyectiles.splice(i, 1);
                }
            }

            const targetFov = apuntando ? 38 : 60;
            if (Math.abs(camera.fov - targetFov) > 0.2) {
                camera.fov += (targetFov - camera.fov) * 0.18;
                camera.updateProjectionMatrix();
            }

            const baseDist = apuntando ? 5.8 : 8.4;
            const alturaCam = (apuntando ? 2.75 : 2.15) + Math.sin(camPitch) * baseDist;
            let horizDist = Math.cos(camPitch) * baseDist;

            const dirAtrasX = -Math.sin(camYaw);
            const dirAtrasZ = -Math.cos(camYaw);
            const hombroOffset = apuntando ? 1.35 : 0;

            for (const obs of obstaculos) {
                const cx = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                const cz = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;
                const distObs = Math.hypot(cx - obs.x, cz - obs.z);
                if (distObs < obs.r + 0.9) {
                    horizDist = Math.max(2.8, horizDist - (obs.r + 0.9 - distObs));
                }
            }

            const camTargetX = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
            const camTargetY = jugadorMesh.position.y + alturaCam;
            const camTargetZ = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;

            camera.position.lerp(new THREE.Vector3(camTargetX, camTargetY, camTargetZ), 0.18);
            camera.lookAt(
                jugadorMesh.position.x + Math.sin(camYaw) * 6 + rightX * (apuntando ? 0.65 : 0),
                jugadorMesh.position.y + (apuntando ? 1.85 : 1.5) + Math.sin(camPitch) * 3,
                jugadorMesh.position.z + Math.cos(camYaw) * 6 + rightZ * (apuntando ? 0.65 : 0)
            );

            renderer.render(scene, camera);
        }

        animar();
    </script>
</body>
</html>
