<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1b4b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #error-banner {
            display: none;
            position: absolute;
            top: 66px;
            left: 14px;
            right: 14px;
            z-index: 70;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid #fca5a5;
            color: #fef2f2;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ==========================================
           LOBBY ESTILO FREE FIRE
           ========================================== */
        #lobby-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 12px 24px;
            background: transparent;
            pointer-events: none;
        }
        #lobby-screen.oculto {
            display: none;
        }

        .lobby-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .profile-badge {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(250, 204, 21, 0.8);
            border-radius: 8px;
            padding: 5px 9px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .currency-pill {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 800;
            color: #fde047;
        }
        .currency-pill.dia {
            color: #7dd3fc;
            border-color: rgba(125, 211, 252, 0.55);
        }
        .zeta-logo {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #facc15;
            background: rgba(15, 23, 42, 0.88);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(250, 204, 21, 0.65);
        }

        .lobby-middle {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            pointer-events: none;
        }
        .side-menu-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .side-btn {
            background: rgba(15, 23, 42, 0.86);
            border-left: 3px solid #facc15;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            border-right: 1px solid rgba(255, 255, 255, 0.16);
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 0 8px 8px 0;
            color: #f8fafc;
            font-size: 10.5px;
            font-weight: 800;
            padding: 6px 10px;
            text-align: left;
            cursor: pointer;
            min-width: 104px;
        }
        .side-btn:active {
            background: rgba(250, 204, 21, 0.32);
        }

        .friends-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }
        .friend-item {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 7px;
            padding: 4px 8px;
            color: #e2e8f0;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot-online {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
        }

        .lobby-bottom {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            pointer-events: auto;
        }
        .play-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }
        .mode-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(250, 204, 21, 0.65);
            border-radius: 9px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        .mode-pill {
            flex: 1;
            border: none;
            border-radius: 6px;
            padding: 5px 6px;
            font-size: 9px;
            font-weight: 800;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
        }
        .mode-pill.activo {
            background: #facc15;
            color: #0f172a;
        }
        .mode-sub {
            font-size: 9.5px;
            color: #fde047;
            font-weight: 700;
        }
        #btn-iniciar-juego {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            border: 2px solid #fef9c3;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
            flex-shrink: 0;
        }
        #btn-iniciar-juego:active {
            transform: scale(0.96);
        }

        .bottom-tabs {
            display: flex;
            gap: 6px;
            background: rgba(15, 23, 42, 0.9);
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            justify-content: space-between;
        }
        .tab-btn {
            flex: 1;
            background: rgba(30, 41, 59, 0.92);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            padding: 6px 6px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn:active {
            background: #facc15;
            color: #0f172a;
        }

        /* ==========================================
           PANTALLAS DE MENÚ (TIENDA, RULETA, PASE, ETC.)
           ========================================== */
        #menu-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 45;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 27, 75, 0.96));
            flex-direction: column;
            padding: 12px 14px;
            color: #f8fafc;
        }
        #menu-modal.abierto {
            display: flex;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(250, 204, 21, 0.35);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 15px;
            font-weight: 900;
            color: #facc15;
            letter-spacing: 0.6px;
        }
        .modal-top-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-cerrar-modal {
            background: rgba(239, 68, 68, 0.25);
            border: 1px solid #f87171;
            color: #fecaca;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }
        .modal-body {
            flex: 1;
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
            overflow-y: auto;
        }
        .modal-cats {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .cat-item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            padding: 7px 8px;
            font-size: 10.5px;
            font-weight: 800;
            color: #e2e8f0;
            text-align: left;
            cursor: pointer;
        }
        .cat-item.activa {
            background: #facc15;
            color: #0f172a;
        }
        .modal-content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 8px;
            align-content: start;
        }
        .item-card {
            background: rgba(30, 41, 59, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 9px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }
        .item-badge {
            font-size: 18px;
        }
        .item-name {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }
        .item-desc {
            font-size: 9.5px;
            color: #cbd5e1;
        }
        .item-action {
            background: #facc15;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 5px 7px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
        }
        .modal-status-msg {
            font-size: 11px;
            color: #fde047;
            font-weight: 700;
            min-height: 16px;
            margin-top: 6px;
        }

        /* ==========================================
           INTERFAZ EN PARTIDA
           ========================================== */
        #gameplay-ui {
            display: none;
        }
        #gameplay-ui.activo {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #ff3b30;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(250, 204, 21, 0.7);
            border-radius: 10px;
            padding: 7px 12px;
            color: #facc15;
            font-weight: 700;
            font-size: 13px;
        }
        #hud-hp {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
        }
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 56%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(15, 23, 42, 0.58);
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(250, 204, 21, 0.4);
            border-color: #facc15;
        }
        #btn-disparo {
            bottom: 42px;
            right: 24px;
            background: rgba(220, 38, 38, 0.78);
            border-color: #ff6b6b;
            width: 78px;
            height: 78px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 60px;
            right: 116px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.4);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 132px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 126px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-color: #facc15;
            background: rgba(202, 138, 4, 0.42);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 184px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.42);
        }
        #btn-recargar {
            bottom: 182px;
            right: 112px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        #joystick-base {
            position: absolute;
            bottom: 50px;
            left: 34px;
            width: 114px;
            height: 114px;
            background: rgba(15, 23, 42, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #fef08a, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="error-banner"></div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="lobby-top">
                <div class="top-left-group">
                    <div class="profile-badge" id="lobby-player-btn">

                    </div>

        <!-- PANTALLA DE MENÚ INTERACTIVA -->
        <div id="menu-modal">
            <div class="modal-header">

                <div class="modal-top-info">

        <!-- PARTIDA -->

                </div>
                <div class="player-card" id="hud-vivos">vivo: 12 / 50</div>

                HP 200 / 200

            <div class="controls-layer">
                <div id="aim-zone"></div>
                <div id="joystick-base"><div id="joystick-stick"></div></div>

                <div class="touch-btn" id="btn-recargar">🔄</div>

            </div>

    <script>
        const errorBanner = document.getElementById('error-banner');
        function mostrarError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
        }
        window.addEventListener('error', (e) => {
            mostrarError('Error en script: ' + (e.message || 'revisa la consola'));
        });

        function cargarThreeYArrancar() {
            const urls = [
                'https://unpkg.com/three@0.160.0/build/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'
            ];

            function intentar(idx) {
                if (window.THREE) {
                    iniciarJuego();
                    return;
                }
                if (idx >= urls.length) {
                    mostrarError('No se pudo cargar Three.js desde internet. Revisa tu conexión.');
                    return;
                }
                const s = document.createElement('script');
                s.src = urls[idx];
                s.onload = () => {
                    if (window.THREE) iniciarJuego();
                    else intentar(idx + 1);
                };
                s.onerror = () => intentar(idx + 1);
                document.head.appendChild(s);
            }

            intentar(0);
        }

        function iniciarJuego() {
            const container = document.getElementById('game-container');
            const lobbyScreen = document.getElementById('lobby-screen');
            const gameplayUi = document.getElementById('gameplay-ui');
            const crosshair = document.getElementById('crosshair');

            let enLobby = true;
            let menuAbierto = false;
            let nombreJugador = 'Jugador_1';
            let modoActual = 'BR-CLASIFICATORIA';
            let oro = 9947;
            let diamantes = 85;
            let armaEquipada = 'Rifle AR Zeta';
            let presetActivo = 'Táctico 3 Dedos';

            const lobbyOroEl = document.getElementById('lobby-oro');
            const lobbyDiaEl = document.getElementById('lobby-diamantes');
            const modalOroEl = document.getElementById('modal-oro');
            const modalDiaEl = document.getElementById('modal-diamantes');

            function refrescarMonedas() {
                const oroFmt = oro.toLocaleString('en-US');
                lobbyOroEl.textContent = oroFmt;
                modalOroEl.textContent = oroFmt;
                lobbyDiaEl.textContent = diamantes;
                modalDiaEl.textContent = diamantes;
            }

            const datosMenus = {
                TIENDA: {
                    titulo: '🛒 TIENDA ZETA',
                    cats: ['DESTACADOS', 'ARMAS', 'ROPA', 'CARGAR'],
                    items: {
                        DESTACADOS: [
                            { icon: '🔫', name: 'Rifle AR Zeta', desc: 'Cadencia estable • Precisión alta', btn: 'EQUIPAR', action: () => { armaEquipada = 'Rifle AR Zeta'; return 'Equipaste: Rifle AR Zeta'; } },
                            { icon: '🧊', name: 'Muro Gloo +2', desc: 'Refuerzo táctico para partida', btn: '200 🪙', action: () => { if (oro < 200) return 'Oro insuficiente'; oro -= 200; glooRestantes += 2; actualizarHUD(); refrescarMonedas(); return 'Compraste +2 Muros Gloo'; } },
                            { icon: '🦖', name: 'Mascota Dino', desc: 'Acompañante del lobby', btn: 'ACTIVA', action: () => 'Mascota Dino activa en el lobby' }
                        ],
                        ARMAS: [
                            { icon: '🔫', name: 'Rifle AR Zeta', desc: 'Daño medio • 30 balas', btn: 'EQUIPAR', action: () => { armaEquipada = 'Rifle AR Zeta'; return 'Equipaste: Rifle AR Zeta'; } },
                            { icon: '⚡', name: 'Carabina Rápida', desc: 'Disparo ágil a media distancia', btn: '350 🪙', action: () => { if (oro < 350) return 'Oro insuficiente'; oro -= 350; armaEquipada = 'Carabina Rápida'; refrescarMonedas(); return 'Compraste y equipaste Carabina Rápida'; } }

            function renderizarCategoria(menuKey, catName) {
                modalStatus.textContent = '';
                modalCats.querySelectorAll('.cat-item').forEach((el) => {
                    el.classList.toggle('activa', el.dataset.cat === catName);
                });
                modalGrid.innerHTML = '';
                const lista = datosMenus[menuKey].items[catName] || [];
                lista.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-badge">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        <button class="item-action">${item.btn}</button>
                    `;
                    card.querySelector('.item-action').addEventListener('click', () => {
                        modalStatus.textContent = item.action();
                    });
                    modalGrid.appendChild(card);
                });
            }

            function abrirMenu(menuKey) {
                const cfg = datosMenus[menuKey];
                if (!cfg) return;
                refrescarMonedas();
                modalTitle.textContent = cfg.titulo;
                modalCats.innerHTML = '';
                cfg.cats.forEach((cat, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-item' + (idx === 0 ? ' activa' : '');
                    btn.dataset.cat = cat;
                    btn.textContent = cat;
                    btn.addEventListener('click', () => renderizarCategoria(menuKey, cat));
                    modalCats.appendChild(btn);
                });
                renderizarCategoria(menuKey, cfg.cats[0]);
                menuModal.classList.add('abierto');
                menuAbierto = true;

            function crearTexturaSuelo() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#38761d';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 4000; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const r = 1 + Math.random() * 3.5;
                    const tonos = ['#2f6617', '#468c26', '#539e2f', '#3d5a27'];
                    ctx.fillStyle = tonos[Math.floor(Math.random() * tonos.length)];
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(22, 22);
                return tex;
            }

            destelloDisparo.visible = false;

            rifleGrupo.add(receptor, culata, cargador, canion, destelloDisparo);
            pivoteBrazoDer.add(brazoDerMesh, rifleGrupo);

            torsoGrupo.add(pecho, chalecoTactico, cuello, cabezaGrupo, mochilaGrupo, pivoteBrazoIzq, pivoteBrazoDer);
            jugadorMesh.add(pivotePiernaIzq, pivotePiernaDer, torsoGrupo);
            scene.add(jugadorMesh);

            let velY = 0;
            let enSuelo = true;
            let agachado = false;
            let apuntando = false;
            let balas = 30;
            const maxBalas = 30;
            let glooRestantes = 3;
            let tiempoDestello = 0;
            let cicloPaso = 0;
            const proyectiles = [];

            let camYaw = 0;
            let camPitch = 0.22;
            const sensibilidad = 0.0055;

            function actualizarHUD() {
                document.getElementById('hud-municion').textContent = `Balas: ${balas}/${maxBalas} | Gloo: ${glooRestantes}`;
            }

            const joystickBase = document.getElementById('joystick-base');
            const joystickStick = document.getElementById('joystick-stick');
            let joyActivo = false, joyTouchId = null, joyX = 0, joyY = 0;
            const maxRadio = 36;

            function actualizarJoystick(touch) {
                const rect = joystickBase.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxRadio) {
                    dx = (dx / dist) * maxRadio;
                    dy = (dy / dist) * maxRadio;
                }
                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                joyX = dx / maxRadio;
                joyY = dy / maxRadio;
            }

            joystickBase.addEventListener('touchstart', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                joyActivo = true;
                joyTouchId = e.changedTouches[0].identifier;
                actualizarJoystick(e.changedTouches[0]);
            }, { passive: false });

            joystickBase.addEventListener('touchmove', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (!joyActivo) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) actualizarJoystick(t);
                }
            }, { passive: false });

            function soltarJoystick(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        joyActivo = false; joyTouchId = null; joyX = 0; joyY = 0;
                        joystickStick.style.transform = 'translate(0px, 0px)';
                    }
                }
            }
            joystickBase.addEventListener('touchend', soltarJoystick);
            joystickBase.addEventListener('touchcancel', soltarJoystick);

            const aimZone = document.getElementById('aim-zone');
            let aimTouchId = null;
            let lastAimX = 0;
            let lastAimY = 0;

            function aplicarRotacionMira(deltaX, deltaY, factorVertical = 1) {
                camYaw -= deltaX * sensibilidad;
                camPitch = Math.max(-0.22, Math.min(0.72, camPitch + deltaY * sensibilidad * factorVertical));
                jugadorMesh.rotation.y = camYaw;
            }

            aimZone.addEventListener('touchstart', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                if (aimTouchId !== null) return;
                const t = e.changedTouches[0];
                aimTouchId = t.identifier;
                lastAimX = t.clientX;
                lastAimY = t.clientY;
            }, { passive: false });

            aimZone.addEventListener('touchmove', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                if (aimTouchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === aimTouchId) {
                        const dx = t.clientX - lastAimX;
                        const dy = t.clientY - lastAimY;
                        lastAimX = t.clientX;
                        lastAimY = t.clientY;
                        aplicarRotacionMira(dx, dy, 1);
                    }
                }
            }, { passive: false });

            function soltarMira(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === aimTouchId) {
                        aimTouchId = null;
                    }
                }
            }
            aimZone.addEventListener('touchend', soltarMira);
            aimZone.addEventListener('touchcancel', soltarMira);

            const btnDisparo = document.getElementById('btn-disparo');
            let disparando = false;
            let fireTouchId = null;
            let lastFireX = 0;
            let lastFireY = 0;
            let ultimoDisparoTime = 0;
            const intervaloDisparo = 140;

            function disparar() {
                if (enLobby || menuAbierto || balas <= 0) return;
                balas--;
                actualizarHUD();

                destelloDisparo.visible = true;
                tiempoDestello = 45;

                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
                const balaMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xfef08a })
                );
                balaMesh.position.set(
                    jugadorMesh.position.x + dir.x * 1.45,
                    jugadorMesh.position.y + (agachado ? 0.85 : 1.32),
                    jugadorMesh.position.z + dir.z * 1.45
                );
                scene.add(balaMesh);
                proyectiles.push({ mesh: balaMesh, vx: dir.x * 1.55, vz: dir.z * 1.55, vida: 48 });
            }

            btnDisparo.addEventListener('touchstart', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (fireTouchId !== null) return;
                const t = e.changedTouches[0];
                fireTouchId = t.identifier;
                lastFireX = t.clientX;
                lastFireY = t.clientY;
                disparando = true;
                btnDisparo.classList.add('active');
                disparar();
                ultimoDisparoTime = performance.now();
            }, { passive: false });

            btnDisparo.addEventListener('touchmove', (e) => {
                if (enLobby || menuAbierto) return;
                e.preventDefault();
                e.stopPropagation();
                if (!disparando || fireTouchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === fireTouchId) {
                        const dx = t.clientX - lastFireX;
                        const dy = t.clientY - lastFireY;
                        lastFireX = t.clientX;
                        lastFireY = t.clientY;
                        aplicarRotacionMira(dx * 0.55, dy * 0.55, 0.85);
                    }
                }
            }, { passive: false });

            function soltarDisparo(e) {
                for (const t of e.changedTouches) {
                    if (t.identifier === fireTouchId) {
                        disparando = false;
                        fireTouchId = null;
                        btnDisparo.classList.remove('active');
                    }
                }
            }
            btnDisparo.addEventListener('touchend', soltarDisparo);
            btnDisparo.addEventListener('touchcancel', soltarDisparo);
            btnDisparo.addEventListener('mousedown', () => {
                if (enLobby || menuAbierto) return;
                disparando = true;
                disparar();
                ultimoDisparoTime = performance.now();
            });
            window.addEventListener('mouseup', () => { disparando = false; });

            const btnMira = document.getElementById('btn-mira');
            function toggleMira() {
                if (enLobby || menuAbierto) return;
                apuntando = !apuntando;
                btnMira.classList.toggle('active', apuntando);
                crosshair.style.display = apuntando ? 'block' : 'none';
            }
            btnMira.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMira();
            }, { passive: false });
            btnMira.addEventListener('click', toggleMira);

            function ponerGloo() {
                if (enLobby || menuAbierto || glooRestantes <= 0) return;
                glooRestantes--;
                actualizarHUD();

                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
                const glooGrupo = new THREE.Group();

                const panel = new THREE.Mesh(
                    new THREE.BoxGeometry(3.3, 2.25, 0.34),
                    new THREE.MeshStandardMaterial({
                        color: 0x38bdf8,
                        emissive: 0x0284c7,
                        emissiveIntensity: 0.25,
                        transparent: true,
                        opacity: 0.68
                    })
                );
                panel.position.y = 1.12;
                panel.castShadow = true;

                glooGrupo.add(panel);
                const gx = jugadorMesh.position.x + dir.x * 3.1;
                const gz = jugadorMesh.position.z + dir.z * 3.1;
                glooGrupo.position.set(gx, 0, gz);
                glooGrupo.rotation.y = jugadorMesh.rotation.y;
                scene.add(glooGrupo);
                obstaculos.push({ x: gx, z: gz, r: 1.45 });
            }

            function recargar() {
                if (enLobby || menuAbierto) return;
                balas = maxBalas;
                actualizarHUD();
            }

            function saltar() {
                if (enLobby || menuAbierto || !enSuelo) return;
                if (agachado) agachado = false;
                velY = 0.36;
                enSuelo = false;
            }

            function toggleAgachar() {
                if (enLobby || menuAbierto) return;
                agachado = !agachado;
            }

            function vincularBoton(id, fn) {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    fn();
                }, { passive: false });
                el.addEventListener('click', fn);
            }

            vincularBoton('btn-gloo', ponerGloo);
            vincularBoton('btn-recargar', recargar);
            vincularBoton('btn-salto', saltar);
            vincularBoton('btn-agachar', toggleAgachar);

            let ultimoFrame = performance.now();

            function animar(ahora = performance.now()) {
                requestAnimationFrame(animar);
                const dt = Math.min(50, ahora - ultimoFrame);
                ultimoFrame = ahora;

                if (tiempoDestello > 0) {
                    tiempoDestello -= dt;
                    if (tiempoDestello <= 0) destelloDisparo.visible = false;
                }

                if (enLobby) {
                    portalLobby.visible = true;
                    mascotaGrupo.visible = true;
                    portalLobby.rotation.y += dt * 0.0008;
                    mascotaGrupo.position.y = Math.abs(Math.sin(ahora * 0.004)) * 0.08;

                    jugadorMesh.rotation.y = 0.12;
                    pivotePiernaIzq.rotation.x = 0;
                    pivotePiernaDer.rotation.x = 0;
                    pivoteBrazoDer.rotation.x = -0.25;
                    pivoteBrazoIzq.rotation.x = -0.18;

                    camera.position.set(0.25, 1.85, 5.2);
                    camera.lookAt(0.2, 1.25, 0);

                    sombraJugador.position.set(jugadorMesh.position.x, 0.03, jugadorMesh.position.z);
                    renderer.render(scene, camera);
                    return;
                }

                portalLobby.visible = false;
                mascotaGrupo.visible = false;

                if (disparando && ahora - ultimoDisparoTime >= intervaloDisparo) {
                    disparar();
                    ultimoDisparoTime = ahora;
                }

                const velocidad = agachado ? 0.14 : 0.22;
                const forwardX = Math.sin(camYaw);
                const forwardZ = Math.cos(camYaw);
                const rightX = -Math.cos(camYaw);
                const rightZ = Math.sin(camYaw);

                const moveForward = -joyY;
                const moveRight = joyX;
                const intensidadMov = Math.min(1, Math.hypot(moveForward, moveRight));

                const moveVecX = forwardX * moveForward + rightX * moveRight;
                const moveVecZ = forwardZ * moveForward + rightZ * moveRight;

                const nextX = jugadorMesh.position.x + moveVecX * velocidad;
                const nextZ = jugadorMesh.position.z + moveVecZ * velocidad;

                let bloqueado = false;
                for (const obs of obstaculos) {
                    if (Math.hypot(nextX - obs.x, nextZ - obs.z) < obs.r + 0.52) {
                        bloqueado = true;
                        break;
                    }
                }

                if (!bloqueado) {
                    jugadorMesh.position.x = Math.max(-72, Math.min(72, nextX));
                    jugadorMesh.position.z = Math.max(-72, Math.min(72, nextZ));
                }

                jugadorMesh.rotation.y = camYaw;

                const targetTorsoY = agachado ? 0.52 : 0.86;
                torsoGrupo.position.y += (targetTorsoY - torsoGrupo.position.y) * 0.2;
                torsoGrupo.rotation.x += ((agachado ? 0.24 : 0) - torsoGrupo.rotation.x) * 0.2;

                if (intensidadMov > 0.05 && enSuelo) {
                    cicloPaso += dt * 0.015 * intensidadMov;
                    const angPierna = Math.sin(cicloPaso) * 0.62 * intensidadMov;
                    pivotePiernaIzq.rotation.x = angPierna;
                    pivotePiernaDer.rotation.x = -angPierna;
                    pivoteBrazoIzq.rotation.x = apuntando ? -1.1 : -angPierna * 0.55;
                    pivoteBrazoDer.rotation.x = apuntando ? -1.15 : angPierna * 0.4;
                } else {
                    pivotePiernaIzq.rotation.x *= 0.8;
                    pivotePiernaDer.rotation.x *= 0.8;
                    const targetBrazoDer = apuntando ? -1.15 : -0.82;
                    const targetBrazoIzq = apuntando ? -1.1 : -0.75;
                    pivoteBrazoDer.rotation.x += (targetBrazoDer - pivoteBrazoDer.rotation.x) * 0.2;
                    pivoteBrazoIzq.rotation.x += (targetBrazoIzq - pivoteBrazoIzq.rotation.x) * 0.2;
                }

                if (!enSuelo) {
                    jugadorMesh.position.y += velY;
                    velY -= 0.015;
                    if (jugadorMesh.position.y <= 0) {
                        jugadorMesh.position.y = 0;
                        velY = 0;
                        enSuelo = true;
                    }
                }

                sombraJugador.position.x = jugadorMesh.position.x;
                sombraJugador.position.z = jugadorMesh.position.z;
                const escalaSombra = Math.max(0.35, 1 - jugadorMesh.position.y * 0.14);
                sombraJugador.scale.set(escalaSombra, escalaSombra, 1);

                for (let i = proyectiles.length - 1; i >= 0; i--) {
                    const p = proyectiles[i];
                    p.mesh.position.x += p.vx;
                    p.mesh.position.z += p.vz;
                    p.vida--;
                    if (p.vida <= 0) {
                        scene.remove(p.mesh);
                        proyectiles.splice(i, 1);
                    }
                }

                const targetFov = apuntando ? 42 : 60;
                if (Math.abs(camera.fov - targetFov) > 0.2) {
                    camera.fov += (targetFov - camera.fov) * 0.18;
                    camera.updateProjectionMatrix();
                }

                const baseDist = apuntando ? 6.8 : 8.4;
                const alturaCam = (apuntando ? 3.15 : 2.15) + Math.sin(camPitch) * baseDist;
                let horizDist = Math.cos(camPitch) * baseDist;

                const dirAtrasX = -Math.sin(camYaw);
                const dirAtrasZ = -Math.cos(camYaw);
                const hombroOffset = apuntando ? 1.55 : 0;

                for (const obs of obstaculos) {
                    const cx = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                    const cz = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;
                    const distObs = Math.hypot(cx - obs.x, cz - obs.z);
                    if (distObs < obs.r + 0.9) {
                        horizDist = Math.max(2.8, horizDist - (obs.r + 0.9 - distObs));
                    }
                }

                const camTargetX = jugadorMesh.position.x + dirAtrasX * horizDist + rightX * hombroOffset;
                const camTargetY = jugadorMesh.position.y + alturaCam;
                const camTargetZ = jugadorMesh.position.z + dirAtrasZ * horizDist + rightZ * hombroOffset;

                camera.position.lerp(new THREE.Vector3(camTargetX, camTargetY, camTargetZ), 0.18);
                camera.lookAt(
                    jugadorMesh.position.x + Math.sin(camYaw) * 6 + rightX * (apuntando ? 0.5 : 0),
                    jugadorMesh.position.y + (apuntando ? 1.9 : 1.5) + Math.sin(camPitch) * 3,
                    jugadorMesh.position.z + Math.cos(camYaw) * 6 + rightZ * (apuntando ? 0.5 : 0)
                );

                renderer.render(scene, camera);
            }

            animar();
        }

        cargarThreeYArrancar();
    </script>
</body>
</html>
