<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1320;
            font-family: sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Retícula central (activa al apuntar) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            display: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #ff3b30;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        /* HUD Superior */
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .player-card {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 204, 0, 0.55);
            border-radius: 8px;
            padding: 6px 12px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 13px;
        }
        /* Barra de vida */
        #hud-hp {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 5px 8px;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        .hp-track {
            width: 100%;
            height: 7px;
            background: #27272a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 3px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #86efac);
        }
        /* Capa de controles */
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        /* Zona táctil derecha para girar cámara y apuntar */
        #aim-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 4;
        }
        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.48);
            border: 2px solid rgba(255, 255, 255, 0.55);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
            z-index: 6;
        }
        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(255, 204, 0, 0.35);
            border-color: #ffcc00;
        }
        /* Distribución estilo Free Fire a la derecha */
        #btn-disparo {
            bottom: 34px;
            right: 24px;
            background: rgba(220, 38, 38, 0.68);
            border-color: #ff5252;
            width: 76px;
            height: 76px;
            font-size: 28px;
        }
        #btn-mira {
            bottom: 52px;
            right: 114px;
            width: 50px;
            height: 50px;
            border-color: #34d399;
            background: rgba(16, 185, 129, 0.32);
            font-size: 18px;
        }
        #btn-salto {
            bottom: 122px;
            right: 26px;
            width: 50px;
            height: 50px;
        }
        #btn-agachar {
            bottom: 116px;
            right: 88px;
            width: 48px;
            height: 48px;
            border-color: #facc15;
            background: rgba(202, 138, 4, 0.35);
            font-size: 18px;
        }
        #btn-gloo {
            bottom: 174px;
            right: 48px;
            width: 50px;
            height: 50px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.35);
        }
        #btn-recargar {
            bottom: 172px;
            right: 110px;
            width: 46px;
            height: 46px;
            font-size: 17px;
        }
        /* Joystick izquierdo para caminar */
        #joystick-base {
            position: absolute;
            bottom: 42px;
            left: 34px;
            width: 112px;
            height: 112px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }
        #joystick-stick {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #ffe066, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>

        <div id="hud-top">
            <div class="player-card">
                👤 Jugador_1<br>
                <span id="hud-municion" style="font-size:11px; color:#fff;">Balas: 30/30 | Gloo: 3</span>
            </div>
            <div class="player-card">vivo: 12 / 50</div>
        </div>

        <div id="hud-hp">
            HP 200 / 200
            <div class="hp-track"><div class="hp-bar"></div></div>
        </div>

        <div class="controls-layer">
            <div id="aim-zone"></div>

            <div id="joystick-base"><div id="joystick-stick"></div></div>

            <div class="touch-btn" id="btn-recargar">🔄</div>
            <div class="touch-btn" id="btn-gloo">🧊</div>
            <div class="touch-btn" id="btn-agachar">⬇️</div>
            <div class="touch-btn" id="btn-salto">🦘</div>
            <div class="touch-btn" id="btn-mira">🔍</div>
            <div class="touch-btn" id="btn-disparo">🎯</div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
        const container = document.getElementById('game-container');
        const crosshair = document.getElementById('crosshair');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const luzAmbiente = new THREE.HemisphereLight(0xffffff, 0x2d5a27, 0.9);
        scene.add(luzAmbiente);

        const luzSol = new THREE.DirectionalLight(0xfffbeb, 1.1);
        luzSol.position.set(25, 45, 20);
        luzSol.castShadow = true;
        scene.add(luzSol);

        const suelo = new THREE.Mesh(
            new THREE.PlaneGeometry(140, 140),
            new THREE.MeshStandardMaterial({ color: 0x2f6b2f, roughness: 0.9 })
        );
        suelo.rotation.x = -Math.PI / 2;
        suelo.receiveShadow = true;
        scene.add(suelo);

        const grilla = new THREE.GridHelper(140, 35, 0x4ade80, 0x1e4620);
        grilla.position.y = 0.02;
        scene.add(grilla);

        const obstaculos = [];
        function crearArbol(x, z) {
            const grupo = new THREE.Group();
            const tronco = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.45, 2.4, 8),
                new THREE.MeshStandardMaterial({ color: 0x78350f })
            );
            tronco.position.y = 1.2;
            tronco.castShadow = true;

            const copa = new THREE.Mesh(
                new THREE.ConeGeometry(2.1, 4.2, 8),
                new THREE.MeshStandardMaterial({ color: 0x15803d })
            );
            copa.position.y = 4.2;
            copa.castShadow = true;

            grupo.add(tronco, copa);
            grupo.position.set(x, 0, z);
            scene.add(grupo);
            obstaculos.push({ x, z, r: 1.1 });
        }

        function crearCajaCobertura(x, z) {
            const caja = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 1.6, 2.4),
                new THREE.MeshStandardMaterial({ color: 0xb45309 })
            );
            caja.position.set(x, 0.8, z);
            caja.castShadow = true;
            caja.receiveShadow = true;
            scene.add(caja);
            obstaculos.push({ x, z, r: 1.5 });
        }

        for (let i = 0; i < 24; i++) {
            const ang = (i / 24) * Math.PI * 2;
            const dist = 14 + (i % 3) * 14;
            crearArbol(Math.cos(ang) * dist, Math.sin(ang) * dist);
        }
        crearCajaCobertura(6, 6);
        crearCajaCobertura(-8, 10);
        crearCajaCobertura(10, -8);
        crearCajaCobertura(-6, -6);

        // Sombra en el suelo bajo el jugador
        const sombraJugador = new THREE.Mesh(
            new THREE.CircleGeometry(0.75, 20),
            new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
        );
        sombraJugador.rotation.x = -Math.PI / 2;
        sombraJugador.position.y = 0.03;
        scene.add(sombraJugador);

        // Jugador 3D
        const jugadorMesh = new THREE.Group();

        const cuerpo = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 1.3, 0.55),
            new THREE.MeshStandardMaterial({ color: 0x1d4ed8 })
        );
        cuerpo.position.y = 1.15;
        cuerpo.castShadow = true;

        const cabeza = new THREE.Mesh(
            new THREE.BoxGeometry(0.62, 0.62, 0.62),
            new THREE.MeshStandardMaterial({ color: 0xf3c69f })
        );
        cabeza.position.y = 2.15;
        cabeza.castShadow = true;

        const mochila = new THREE.Mesh(
            new THREE.BoxGeometry(0.65, 0.85, 0.35),
            new THREE.MeshStandardMaterial({ color: 0xf59e0b })
        );
        mochila.position.set(0, 1.2, -0.42);

        const rifle = new THREE.Mesh(
            new THREE.BoxGeometry(0.14, 0.18, 1.2),
            new THREE.MeshStandardMaterial({ color: 0x18181b })
        );
        rifle.position.set(0.52, 1.35, 0.45);

        jugadorMesh.add(cuerpo, cabeza, mochila, rifle);
        scene.add(jugadorMesh);

        // Estado del jugador y cámara
        let velY = 0;
        let enSuelo = true;
        let agachado = false;
        let apuntando = false;
        let balas = 30;
        const maxBalas = 30;
        let glooRestantes = 3;
        const proyectiles = [];

        let camYaw = 0;     // Rotación horizontal de cámara/mira
        let camPitch = 0.22; // Altura vertical de cámara/mira
        const sensibilidad = 0.0055;

        function actualizarHUD() {
            document.getElementById('hud-municion').textContent = `Balas: ${balas}/${maxBalas} | Gloo: ${glooRestantes}`;
        }

        // 1. Joystick izquierdo (solo caminar)
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let joyActivo = false, joyTouchId = null, joyX = 0, joyY = 0;
        const maxRadio = 35;

        function actualizarJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            if (dist > maxRadio) {
                dx = (dx / dist) * maxRadio;
                dy = (dy / dist) * maxRadio;
            }
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxRadio;
            joyY = dy / maxRadio;
        }

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            joyActivo = true;
            joyTouchId = e.changedTouches[0].identifier;
            actualizarJoystick(e.changedTouches[0]);
        }, { passive: false });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!joyActivo) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) actualizarJoystick(t);
            }
        }, { passive: false });

        function soltarJoystick(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyActivo = false; joyTouchId = null; joyX = 0; joyY = 0;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        }
        joystickBase.addEventListener('touchend', soltarJoystick);
        joystickBase.addEventListener('touchcancel', soltarJoystick);

        // 2. Zona derecha para apuntar / girar cámara (multitouch independiente)
        const aimZone = document.getElementById('aim-zone');
        let aimTouchId = null;
        let lastAimX = 0;
        let lastAimY = 0;

        function aplicarRotacionMira(deltaX, deltaY, factorVertical = 1) {
            camYaw -= deltaX * sensibilidad;
            camPitch = Math.max(-0.25, Math.min(0.75, camPitch + deltaY * sensibilidad * factorVertical));
            jugadorMesh.rotation.y = camYaw;
        }

        aimZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (aimTouchId !== null) return;
            const t = e.changedTouches[0];
            aimTouchId = t.identifier;
            lastAimX = t.clientX;
            lastAimY = t.clientY;
        }, { passive: false });

        aimZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (aimTouchId === null) return;
            for (const t of e.changedTouches) {
                if (t.identifier === aimTouchId) {
                    const dx = t.clientX - lastAimX;
                    const dy = t.clientY - lastAimY;
                    lastAimX = t.clientX;
                    lastAimY = t.clientY;
                    aplicarRotacionMira(dx, dy, 1);
                }
            }
        }, { passive: false });

        function soltarMira(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === aimTouchId) {
                    aimTouchId = null;
                }
            }
        }
        aimZone.addEventListener('touchend', soltarMira);
        aimZone.addEventListener('touchcancel', soltarMira);

        // 3. Disparo continuo + arrastre de mira (subir mira)
        const btnDisparo = document.getElementById('btn-disparo');
        let disparando = false;
        let fireTouchId = null;
        let lastFireX = 0;
        let lastFireY = 0;
        let ultimoDisparoTime = 0;
        const intervaloDisparo = 140; // ms entre balas en ráfaga

        function disparar() {
            if (balas <= 0) return;
            balas--;
            actualizarHUD();

            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
            const balaMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.14, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfef08a })
            );
            balaMesh.position.set(
                jugadorMesh.position.x + dir.x * 1.4,
                jugadorMesh.position.y + (agachado ? 0.8 : 1.35),
                jugadorMesh.position.z + dir.z * 1.4
            );
            scene.add(balaMesh);
            proyectiles.push({ mesh: balaMesh, vx: dir.x * 1.45, vz: dir.z * 1.45, vida: 50 });
        }

        btnDisparo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const t = e.changedTouches[0];
            fireTouchId = t.identifier;
            lastFireX = t.clientX;
            lastFireY = t.clientY;
            disparando = true;
            btnDisparo.classList.add('active');
            disparar();
            ultimoDisparoTime = performance.now();
        }, { passive: false });

        btnDisparo.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!disparando) return;
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    const dx = t.clientX - lastFireX;
                    const dy = t.clientY - lastFireY;
                    lastFireX = t.clientX;
                    lastFireY = t.clientY;
                    aplicarRotacionMira(dx * 0.75, dy * 0.75, 1.15);
                }
            }
        }, { passive: false });

        function soltarDisparo(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === fireTouchId) {
                    disparando = false;
                    fireTouchId = null;
                    btnDisparo.classList.remove('active');
                }
            }
        }
        btnDisparo.addEventListener('touchend', soltarDisparo);
        btnDisparo.addEventListener('touchcancel', soltarDisparo);
        btnDisparo.addEventListener('mousedown', () => {
            disparando = true;
            disparar();
            ultimoDisparoTime = performance.now();
        });
        window.addEventListener('mouseup', () => { disparando = false; });

        // 4. Botón Mira / Zoom
        const btnMira = document.getElementById('btn-mira');
        function toggleMira() {
            apuntando = !apuntando;
            btnMira.classList.toggle('active', apuntando);
            crosshair.style.display = apuntando ? 'block' : 'none';
        }
        btnMira.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleMira();
        }, { passive: false });
        btnMira.addEventListener('click', toggleMira);

        // 5. Otras acciones
        function ponerGloo() {
            if (glooRestantes <= 0) return;
            glooRestantes--;
            actualizarHUD();

            const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), jugadorMesh.rotation.y);
            const gloo = new THREE.Mesh(
                new THREE.BoxGeometry(3.2, 2.2, 0.35),
                new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.72,
                    roughness: 0.2
                })
            );
            gloo.position.set(
                jugadorMesh.position.x + dir.x * 3.2,
                1.1,
                jugadorMesh.position.z + dir.z * 3.2
            );
            gloo.rotation.y = jugadorMesh.rotation.y;
            scene.add(gloo);
        }

        function recargar() {
            balas = maxBalas;
            actualizarHUD();
        }

        function saltar() {
            if (!enSuelo) return;
            if (agachado) {
                agachado = false;
                jugadorMesh.scale.y = 1;
            }
            velY = 0.36;
            enSuelo = false;
        }

        function toggleAgachar() {
            agachado = !agachado;
            jugadorMesh.scale.y = agachado ? 0.62 : 1;
        }

        function vincularBoton(id, fn) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                fn();
            }, { passive: false });
            el.addEventListener('click', fn);
        }

        vincularBoton('btn-gloo', ponerGloo);
        vincularBoton('btn-recargar', recargar);
        vincularBoton('btn-salto', saltar);
        vincularBoton('btn-agachar', toggleAgachar);

        function animar(ahora = 0) {
            requestAnimationFrame(animar);

            // Ráfaga al mantener presionado el botón de disparo
            if (disparando && ahora - ultimoDisparoTime >= intervaloDisparo) {
                disparar();
                ultimoDisparoTime = ahora;
            }

            // Movimiento relativo a la dirección de la cámara/mira
            const velocidad = agachado ? 0.14 : 0.22;
            const forwardX = Math.sin(camYaw);
            const forwardZ = Math.cos(camYaw);
            const rightX = Math.cos(camYaw);
            const rightZ = -Math.sin(camYaw);

            // joyY negativo es empujar joystick hacia arriba (avanzar)
            const moveForward = -joyY;
            const moveRight = joyX;

            const moveVecX = forwardX * moveForward + rightX * moveRight;
            const moveVecZ = forwardZ * moveForward + rightZ * moveRight;

            const nextX = jugadorMesh.position.x + moveVecX * velocidad;
            const nextZ = jugadorMesh.position.z + moveVecZ * velocidad;

            let bloqueado = false;
            for (const obs of obstaculos) {
                if (Math.hypot(nextX - obs.x, nextZ - obs.z) < obs.r + 0.5) {
                    bloqueado = true;
                    break;
                }
            }

            if (!bloqueado) {
                jugadorMesh.position.x = Math.max(-62, Math.min(62, nextX));
                jugadorMesh.position.z = Math.max(-62, Math.min(62, nextZ));
            }

            jugadorMesh.rotation.y = camYaw;

            // Salto y gravedad
            if (!enSuelo) {
                jugadorMesh.position.y += velY;
                velY -= 0.015;
                if (jugadorMesh.position.y <= 0) {
                    jugadorMesh.position.y = 0;
                    velY = 0;
                    enSuelo = true;
                }
            }

            // Actualizar sombra en el suelo
            sombraJugador.position.x = jugadorMesh.position.x;
            sombraJugador.position.z = jugadorMesh.position.z;
            const escalaSombra = Math.max(0.35, 1 - jugadorMesh.position.y * 0.14);
            sombraJugador.scale.set(escalaSombra, escalaSombra, 1);

            // Proyectiles
            for (let i = proyectiles.length - 1; i >= 0; i--) {
                const p = proyectiles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.z += p.vz;
                p.vida--;
                if (p.vida <= 0) {
                    scene.remove(p.mesh);
                    proyectiles.splice(i, 1);
                }
            }

            // Zoom suave de mira
            const targetFov = apuntando ? 36 : 60;
            if (Math.abs(camera.fov - targetFov) > 0.2) {
                camera.fov += (targetFov - camera.fov) * 0.18;
                camera.updateProjectionMatrix();
            }

            // Cámara en tercera persona siguiendo camYaw y camPitch
            const distCam = apuntando ? 5.2 : 8.5;
            const alturaCam = 2.2 + Math.sin(camPitch) * distCam;
            const horizDist = Math.cos(camPitch) * distCam;

            const camTargetX = jugadorMesh.position.x - Math.sin(camYaw) * horizDist;
            const camTargetY = jugadorMesh.position.y + alturaCam;
            const camTargetZ = jugadorMesh.position.z - Math.cos(camYaw) * horizDist;

            camera.position.lerp(new THREE.Vector3(camTargetX, camTargetY, camTargetZ), 0.18);
            camera.lookAt(
                jugadorMesh.position.x + Math.sin(camYaw) * 6,
                jugadorMesh.position.y + 1.5 + Math.sin(camPitch) * 3,
                jugadorMesh.position.z + Math.cos(camYaw) * 6
            );

            renderer.render(scene, camera);
        }

        animar();
    </script>
</body>
