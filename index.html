<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeta Battle - Battle Royale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1b4d3e;
            font-family: sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* HUD Superior */
        #hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        #minimap {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.7);
            background: rgba(20, 45, 30, 0.85);
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        .status-pills {
            display: flex;
            gap: 8px;
        }
        .pill {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 204, 0, 0.5);
            border-radius: 6px;
            padding: 5px 10px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }
        .pill span {
            color: #ffcc00;
        }
        /* Barras HP / EP abajo al centro */
        #hud-bars {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.25);
        }
        #ep-fill { width: 75%; height: 100%; background: #ff9800; }
        #hp-fill { width: 100%; height: 100%; background: #ffffff; }
        .hp-text {
            text-align: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        /* Tarjeta de arma arriba a la derecha */
        #weapon-box {
            position: absolute;
            top: 52px;
            right: 10px;
            background: rgba(0, 0, 0, 0.65);
            border-right: 4px solid #ffcc00;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            text-align: right;
            pointer-events: none;
        }
        /* Controles táctiles */
        .controls-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.55);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            pointer-events: auto;
            touch-action: none;
        }
        .touch-btn:active {
            transform: scale(0.9);
            background: rgba(255, 204, 0, 0.35);
        }
        #btn-disparo {
            bottom: 38px;
            right: 32px;
            background: rgba(220, 38, 38, 0.55);
            border-color: #ff5252;
            width: 76px;
            height: 76px;
            font-size: 28px;
        }
        #btn-salto {
            bottom: 124px;
            right: 36px;
            width: 50px;
            height: 50px;
        }
        #btn-recargar {
            bottom: 38px;
            right: 122px;
            width: 50px;
            height: 50px;
        }
        #btn-gloo {
            bottom: 102px;
            right: 106px;
            width: 52px;
            height: 52px;
            border-color: #38bdf8;
            background: rgba(14, 165, 233, 0.35);
            font-size: 18px;
        }
        #joystick-base {
            position: absolute;
            bottom: 38px;
            left: 35px;
            width: 112px;
            height: 112px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-stick {
            width: 46px;
            height: 46px;
            background: radial-gradient(circle, #ffe066, #f59e0b);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Superior -->
        <div id="hud-top">
            <canvas id="minimap" width="95" height="95"></canvas>
            <div class="status-pills">
                <div class="pill">VIVOS <span id="vivos-txt">12</span></div>
                <div class="pill">BAJAS <span id="kills-txt">0</span></div>
            </div>
        </div>

        <div id="weapon-box">
            <div style="color:#ffcc00; font-weight:bold;">M4A1 - TÁCTICA</div>
            <div id="hud-municion">30 / 120</div>
        </div>

        <!-- Barras EP / HP estilo Free Fire -->
        <div id="hud-bars">
            <div class="bar-bg"><div id="ep-fill"></div></div>
            <div class="bar-bg"><div id="hp-fill"></div></div>
            <div class="hp-text">HP 200/200 | Gloo: <span id="gloo-count">3</span></div>
        </div>

        <!-- Controles Táctiles -->
        <div class="controls-layer">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
            <div class="touch-btn" id="btn-gloo">🧊</div>
            <div class="touch-btn" id="btn-salto">🦘</div>
            <div class="touch-btn" id="btn-recargar">🔄</div>
            <div class="touch-btn" id="btn-disparo">🎯</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimap');
        const miniCtx = miniCanvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        const MAPA = 2400;

        let jugador = {
            x: MAPA / 2,
            y: MAPA / 2,
            velocidad: 4.5,
            angulo: 0,
            nombre: "Jugador_1",
            escalaSalto: 1,
            saltando: false,
            balas: 30,
            maxBalas: 30,
            gloo: 3,
            kills: 0,
            fogonazo: 0
        };

        let balas = [];
        let paredesGloo = [];

        // Generar árboles, rocas y cajas de botín en la isla
        const arboles = Array.from({ length: 45 }, () => ({
            x: 150 + Math.random() * (MAPA - 300),
            y: 150 + Math.random() * (MAPA - 300),
            r: 32 + Math.random() * 18
        }));

        const cajasLoot = Array.from({ length: 18 }, () => ({
            x: 200 + Math.random() * (MAPA - 400),
            y: 200 + Math.random() * (MAPA - 400),
            abierta: false
        }));

        // Joystick
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let joyActivo = false, joyTouchId = null, joyDx = 0, joyDy = 0;
        const maxRadio = 35;

        function actualizarJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            if (dist > maxRadio) {
                dx = (dx / dist) * maxRadio;
                dy = (dy / dist) * maxRadio;
            }
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyDx = dx / maxRadio;
            joyDy = dy / maxRadio;
            if (dist > 5) jugador.angulo = Math.atan2(dy, dx);
        }

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joyActivo = true;
            joyTouchId = e.changedTouches[0].identifier;
            actualizarJoystick(e.changedTouches[0]);
        }, { passive: false });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joyActivo) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) actualizarJoystick(t);
            }
        }, { passive: false });

        function soltarJoystick(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyActivo = false; joyTouchId = null; joyDx = 0; joyDy = 0;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        }
        joystickBase.addEventListener('touchend', soltarJoystick);
        joystickBase.addEventListener('touchcancel', soltarJoystick);

        // Acciones
        function actualizarHUD() {
            document.getElementById('hud-municion').textContent = `${jugador.balas} / 120`;
            document.getElementById('gloo-count').textContent = jugador.gloo;
        }

        function disparar() {
            if (jugador.balas <= 0) return;
            jugador.balas--;
            jugador.fogonazo = 3;
            actualizarHUD();
            balas.push({
                x: jugador.x + Math.cos(jugador.angulo) * 32,
                y: jugador.y + Math.sin(jugador.angulo) * 32,
                vx: Math.cos(jugador.angulo) * 14,
                vy: Math.sin(jugador.angulo) * 14,
                vida: 55
            });
        }

        function ponerGloo() {
            if (jugador.gloo <= 0) return;
            jugador.gloo--;
            actualizarHUD();
            paredesGloo.push({
                x: jugador.x + Math.cos(jugador.angulo) * 55,
                y: jugador.y + Math.sin(jugador.angulo) * 55,
                angulo: jugador.angulo
            });
        }

        function recargar() { jugador.balas = jugador.maxBalas; actualizarHUD(); }
        function saltar() {
            if (jugador.saltando) return;
            jugador.saltando = true;
            jugador.escalaSalto = 1.3;
            setTimeout(() => { jugador.escalaSalto = 1; jugador.saltando = false; }, 280);
        }

        document.getElementById('btn-disparo').addEventListener('touchstart', (e) => { e.preventDefault(); disparar(); });
        document.getElementById('btn-gloo').addEventListener('touchstart', (e) => { e.preventDefault(); ponerGloo(); });
        document.getElementById('btn-recargar').addEventListener('touchstart', (e) => { e.preventDefault(); recargar(); });
        document.getElementById('btn-salto').addEventListener('touchstart', (e) => { e.preventDefault(); saltar(); });

        // Personaje estilo Free Fire (vista superior con mochila, chaleco, casco y rifle)
        function dibujarSoldadoFF(x, y, angulo, escala) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(escala, escala);

            // Sombra
            ctx.beginPath();
            ctx.arc(3, 5, 24, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.fill();

            ctx.rotate(angulo);

            // Mochila nivel 3 atrás
            ctx.fillStyle = "#374151";
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 2;
            ctx.fillRect(-20, -11, 10, 22);
            ctx.strokeRect(-20, -11, 10, 22);

            // Brazos y rifle táctico
            ctx.fillStyle = "#d97706";
            ctx.fillRect(4, 6, 16, 6);
            ctx.fillRect(4, -12, 16, 6);

            ctx.fillStyle = "#1f2937";
            ctx.fillRect(8, -3, 28, 6);
            ctx.fillStyle = "#fbbf24";
            ctx.fillRect(16, -2, 8, 4);

            // Fogonazo de disparo
            if (jugador.fogonazo > 0) {
                ctx.beginPath();
                ctx.arc(40, 0, 8, 0, Math.PI * 2);
                ctx.fillStyle = "#fef08a";
                ctx.fill();
                jugador.fogonazo--;
            }

            // Chaleco táctico
            ctx.beginPath();
            ctx.arc(0, 0, 17, 0, Math.PI * 2);
            ctx.fillStyle = "#111827";
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#f59e0b";
            ctx.stroke();

            // Cabeza con banda roja estilo personaje FF
            ctx.beginPath();
            ctx.arc(1, 0, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#f3c69f";
            ctx.fill();
            ctx.fillStyle = "#dc2626";
            ctx.fillRect(-3, -10, 5, 20);

            ctx.restore();

            // Etiqueta de nombre
            const off = 42 * escala;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x - 50, y - off - 14, 100, 18);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`🔥 ${jugador.nombre}`, x, y - off - 1);
        }

        function dibujarMinimapa() {
            miniCtx.clearRect(0, 0, 95, 95);
            // Zona segura blanca
            miniCtx.strokeStyle = "#ffffff";
            miniCtx.lineWidth = 2;
            miniCtx.beginPath();
            miniCtx.arc(47.5, 47.5, 34, 0, Math.PI * 2);
            miniCtx.stroke();

            // Posición del jugador
            const mx = (jugador.x / MAPA) * 95;
            const my = (jugador.y / MAPA) * 95;
            miniCtx.fillStyle = "#ffcc00";
            miniCtx.beginPath();
            miniCtx.arc(mx, my, 3.5, 0, Math.PI * 2);
            miniCtx.fill();
        }

        function loopJuego() {
            jugador.x = Math.max(40, Math.min(MAPA - 40, jugador.x + joyDx * jugador.velocidad));
            jugador.y = Math.max(40, Math.min(MAPA - 40, jugador.y + joyDy * jugador.velocidad));

            // Cámara centrada en el jugador
            const camX = jugador.x - canvas.width / 2;
            const camY = jugador.y - canvas.height / 2;

            ctx.save();
            ctx.translate(-camX, -camY);

            // Mar alrededor de la isla
            ctx.fillStyle = "#0e7490";
            ctx.fillRect(camX, camY, canvas.width, canvas.height);

            // Arena de playa e isla de césped
            ctx.fillStyle = "#eab308";
            ctx.fillRect(0, 0, MAPA, MAPA);
            ctx.fillStyle = "#2d5a27";
            ctx.fillRect(60, 60, MAPA - 120, MAPA - 120);

            // Camino de tierra cruzando el mapa
            ctx.fillStyle = "#855e42";
            ctx.fillRect(MAPA / 2 - 45, 60, 90, MAPA - 120);
            ctx.fillRect(60, MAPA / 2 - 45, MAPA - 120, 90);

            // Cajas de loot
            for (const c of cajasLoot) {
                if (!c.abierta && Math.hypot(jugador.x - c.x, jugador.y - c.y) < 35) {
                    c.abierta = true;
                    jugador.gloo++;
                    jugador.balas = jugador.maxBalas;
                    actualizarHUD();
                }
                if (!c.abierta) {
                    ctx.fillStyle = "#f59e0b";
                    ctx.fillRect(c.x - 12, c.y - 12, 24, 24);
                    ctx.strokeStyle = "#fff";
                    ctx.strokeRect(c.x - 12, c.y - 12, 24, 24);
                }
            }

            // Paredes Gloo
            for (const p of paredesGloo) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angulo + Math.PI / 2);
                ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
                ctx.strokeStyle = "#e0f2fe";
                ctx.lineWidth = 3;
                ctx.fillRect(-32, -8, 64, 16);
                ctx.strokeRect(-32, -8, 64, 16);
                ctx.restore();
            }

            // Balas
            for (let i = balas.length - 1; i >= 0; i--) {
                const b = balas[i];
                b.x += b.vx; b.y += b.vy; b.vida--;
                ctx.fillStyle = "#fef08a";
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
                if (b.vida <= 0) balas.splice(i, 1);
            }

            // Jugador
            dibujarSoldadoFF(jugador.x, jugador.y, jugador.angulo, jugador.escalaSalto);

            // Árboles (copas por encima)
            for (const a of arboles) {
                ctx.beginPath();
                ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(20, 83, 45, 0.92)";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#14532d";
                ctx.stroke();
            }

            ctx.restore();
            dibujarMinimapa();
            requestAnimationFrame(loopJuego);
        }

        loopJuego();
    </script>
</body>
</html>
